<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f1efe8;
    --color-app-bg: #edeae1;
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #9a9890;
    --color-text-info: #185fa5;
    --color-border-tertiary: #d8d5cc;
    --color-border-info: #185fa5;
    --color-accent: #185fa5;
    --color-accent-soft: #e6f1fb;
    --border-radius-sm: 8px;
    --border-radius-md: 10px;
    --border-radius-lg: 18px;
    --border-radius-pill: 999px;
    --shadow-card: 0 1px 2px rgba(30,28,20,0.05), 0 4px 14px rgba(30,28,20,0.06);
    --shadow-elevated: 0 12px 32px rgba(30,28,20,0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--color-app-bg);
    color: var(--color-text-primary);
    margin: 0;
    padding: 1.25rem;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 1rem; }
  button {
    border: 1px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    border-radius: var(--border-radius-pill);
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--color-text-primary);
    min-height: 38px;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease, border-color 0.15s ease;
  }
  button:hover { background: var(--color-background-secondary); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  #autoAssignBtn {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(24,95,165,0.32);
  }
  #autoAssignBtn:hover { background: #134d87; border-color: #134d87; }
  input, select {
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    padding: 8px 10px;
    font-size: 13px;
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    min-height: 38px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-soft);
  }
  table { border-collapse: collapse; }
  #app { position: relative; max-width: 1200px; margin: 0 auto; }
  .app-header {
    position: sticky;
    top: 0.75rem;
    z-index: 6;
    background: var(--color-background-primary);
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
    margin-bottom: 1rem;
  }
  .tab-bar {
    display: flex;
    gap: 3px;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-pill);
    padding: 4px;
    width: fit-content;
  }
  .tab-pill {
    border: none;
    border-radius: var(--border-radius-pill);
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--color-text-secondary);
    min-height: auto;
    box-shadow: none;
  }
  .tab-pill:hover { background: rgba(0,0,0,0.05); }
  .tab-pill.active {
    background: var(--color-background-primary);
    color: var(--color-text-info);
    box-shadow: var(--shadow-card);
  }
  .app-surface {
    background: var(--color-background-primary);
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-card);
    border: none;
  }
</style>
</head>
<body>
<div id="monthSetupView" class="app-surface" style="max-width:380px; margin:4rem auto 0; text-align:center; padding:2.25rem 1.75rem;">
  <div style="width:52px; height:52px; margin:0 auto 14px; border-radius:16px; background:var(--color-accent-soft); display:flex; align-items:center; justify-content:center; font-size:24px;">🗓️</div>
  <h1 style="margin-bottom:4px;">勤務表自動作成ツール</h1>
  <p style="font-size:13px; color:var(--color-text-secondary); margin:0 0 20px;">何月の勤務表を作成しますか?</p>
  <div style="display:flex; justify-content:center; gap:8px; margin-bottom:20px;">
    <select id="monthSetupYear" style="font-size:16px; padding:10px 8px; text-align:center;"></select>
    <select id="monthSetupMonth" style="font-size:16px; padding:10px 8px; text-align:center;"></select>
  </div>
  <button id="monthSetupConfirmBtn" style="width:100%; font-size:14px; padding:11px 28px;">この月で始める</button>
  <p style="font-size:11px; color:var(--color-text-tertiary); margin:16px 0 0;">💡 ブラウザのメニューから「ホーム画面に追加」すると、アプリのように起動できます</p>
</div>
<div id="app" style="display:none;">
  <h1 style="position:absolute; left:-9999px;">勤務表自動作成ツール</h1>
  <h2 style="position:absolute; left:-9999px;">チームのシフトを月間カレンダーで管理する勤務表。メンバーとシフト種類を登録し、各日に割り当てます。</h2>

  <div class="app-header">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="prevMonth" aria-label="前の月" style="min-height:34px; padding:6px 12px;">&#x2039;</button>
        <span id="monthLabel" style="font-size:17px; font-weight:700; min-width:110px; text-align:center;"></span>
        <button id="nextMonth" aria-label="次の月" style="min-height:34px; padding:6px 12px;">&#x203A;</button>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <span id="syncStatusBadge" style="font-size:11px; color:var(--color-text-tertiary); white-space:nowrap;"></span>
        <button id="manageRulesBtn" style="font-size:12px; padding:7px 12px; min-height:34px;">ルール</button>
        <button id="manageMembersBtn" style="font-size:12px; padding:7px 12px; min-height:34px;">メンバー</button>
        <button id="manageShiftsBtn" style="font-size:12px; padding:7px 12px; min-height:34px;">シフト設定</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
      <div class="tab-bar">
        <button id="tabInput" class="tab-pill active">希望入力</button>
        <button id="tabResult" class="tab-pill">割り振り結果</button>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="autoAssignBtn">自動割り振り</button>
        <button id="exportBtn" style="font-size:12px; padding:7px 12px; min-height:34px;">Excel出力</button>
      </div>
    </div>
  </div>

  <div id="legend" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem;"></div>

  <div id="inputView">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
      <p style="font-size:13px; color:var(--color-text-secondary); margin:0;">各日のセルをクリックして、希望シフトまたはNG(出勤不可)を設定してください。</p>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="clearAllWishesBtn" style="font-size:12px; padding:6px 10px; min-height:32px; flex-shrink:0;">この月の希望をすべてクリア</button>
        <button id="clearAllManualBtn" style="font-size:12px; padding:6px 10px; min-height:32px; flex-shrink:0;">この月の勤務調整をすべてクリア</button>
      </div>
    </div>
    <div id="roleFilter" style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;"></div>
    <div id="inputGrid" class="app-surface" style="overflow:auto; max-height:65vh;"></div>
  </div>

  <div id="resultView" style="display:none;">
    <p style="font-size:13px; color:var(--color-text-secondary); margin:0 0 8px;">セルをクリックすると割り振りを手動で変更できます。二重下線=本人の希望どおり、枠線=本人の希望、セル上部の「・」=勤務調整のため手動で変更したセル(自動割り振りでも保護されます)。</p>
    <div id="resultGrid" class="app-surface" style="overflow-x:auto; margin-bottom:1rem;"></div>
    <div id="warnings" style="margin-bottom:1rem;"></div>
    <div id="summaryGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:12px;"></div>
  </div>

  <div id="modalOverlay" style="display:none; min-height:400px; background:rgba(20,18,12,0.5); backdrop-filter:blur(1px); align-items:center; justify-content:center; position:fixed; inset:0; z-index:10;">
    <div id="modalContent" class="app-surface" style="box-shadow:var(--shadow-elevated); padding:1.25rem; width:360px; max-width:90%; max-height:80vh; overflow-y:auto;"></div>
  </div>
</div>

<script>
(function(){
  // ---- Supabase連携設定 ----
  // Supabaseプロジェクトを作成したら、URLとanon keyをここに設定してください。
  // (anon keyはRow Level Securityで保護される前提の「公開して良い」キーです。
  //  このアプリはGitHub Pages等で公開されるため、ここに直接書いて構いません)
  const SUPABASE_URL = 'https://sxjaplqetzfcujqtdfeq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qf-3CngH4AadXpDYFDaogw_5VTdAlUS';
  const SYNC_TABLE = 'schedule_state';
  const SYNC_ROW_ID = 'main';
  const SYNC_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
  const supabaseClient = SYNC_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let syncStatus = SYNC_ENABLED ? 'connecting' : 'disabled'; // disabled | connecting | synced | syncing | error
  let lastPushedUpdatedAt = null; // 自分が送った更新のタイムスタンプ(realtimeで自分の書き込みを無視するため)
  let cloudSaveTimer = null;

  function setSyncStatus(status){
    syncStatus = status;
    const el = document.getElementById('syncStatusBadge');
    if(!el) return;
    const labels = {
      disabled: '📴 クラウド同期 未設定',
      connecting: '☁️ 接続中…',
      synced: '☁️ 同期済み',
      syncing: '☁️ 同期中…',
      error: '⚠️ 同期エラー(ローカルのみ保存)'
    };
    el.textContent = labels[status] || '';
    el.title = SYNC_ENABLED
      ? 'このデバイスのデータをクラウド(Supabase)経由で他のデバイスと共有・同期します'
      : 'Supabaseの設定(SUPABASE_URL / SUPABASE_ANON_KEY)が未入力のため、このブラウザだけに保存されています';
  }

  // localStorageに保存する内容と同じ形で、クラウドへ保存/クラウドから復元する
  function buildStatePayload(){
    return {
      members, preferences, assignments, manualEdit, nightNgPairs,
      weekendDayReq, careRequired, monthlyOffTarget, nightOnlyMax, nightTrainingTarget,
      currentDate: currentDate.toISOString()
    };
  }
  function applyStatePayload(d){
    if(Array.isArray(d.members) && d.members.length) members = d.members;
    if(d.preferences) preferences = d.preferences;
    if(d.assignments) assignments = d.assignments;
    if(d.manualEdit) manualEdit = d.manualEdit;
    if(Array.isArray(d.nightNgPairs)) nightNgPairs = d.nightNgPairs;
    if(d.weekendDayReq !== undefined) weekendDayReq = d.weekendDayReq;
    if(d.careRequired) careRequired = d.careRequired;
    if(d.monthlyOffTarget !== undefined) monthlyOffTarget = d.monthlyOffTarget;
    if(d.nightOnlyMax !== undefined) nightOnlyMax = d.nightOnlyMax;
    if(d.nightTrainingTarget !== undefined) nightTrainingTarget = d.nightTrainingTarget;
    if(d.currentDate){ currentDate = new Date(d.currentDate); currentDate.setDate(1); }
  }

  function scheduleCloudSave(){
    if(!SYNC_ENABLED) return;
    setSyncStatus('syncing');
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(pushToCloud, 800);
  }
  async function pushToCloud(){
    if(!SYNC_ENABLED) return;
    const updatedAt = new Date().toISOString();
    lastPushedUpdatedAt = updatedAt;
    try {
      const { error } = await supabaseClient
        .from(SYNC_TABLE)
        .upsert({ id: SYNC_ROW_ID, data: buildStatePayload(), updated_at: updatedAt });
      if(error) throw error;
      setSyncStatus('synced');
    } catch(e) {
      console.error('cloud save failed', e);
      setSyncStatus('error');
    }
  }
  async function pullFromCloud(){
    if(!SYNC_ENABLED) return;
    try {
      const { data, error } = await supabaseClient
        .from(SYNC_TABLE)
        .select('data, updated_at')
        .eq('id', SYNC_ROW_ID)
        .maybeSingle();
      if(error) throw error;
      if(data && data.data){
        applyStatePayload(data.data);
        lastPushedUpdatedAt = data.updated_at;
        saveToStorage(true); // ローカルにも反映(クラウドへの再送信はしない)
        refreshAllViews();
      }
      setSyncStatus('synced');
      subscribeRealtime();
    } catch(e) {
      console.error('cloud load failed', e);
      setSyncStatus('error');
    }
  }
  function subscribeRealtime(){
    if(!SYNC_ENABLED) return;
    supabaseClient
      .channel('schedule_state_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: SYNC_TABLE, filter: `id=eq.${SYNC_ROW_ID}` }, (payload) => {
        const row = payload.new;
        if(!row || !row.data) return;
        if(row.updated_at === lastPushedUpdatedAt) return; // 自分自身の書き込みは無視
        applyStatePayload(row.data);
        lastPushedUpdatedAt = row.updated_at;
        saveToStorage(true);
        refreshAllViews();
        setSyncStatus('synced');
      })
      .subscribe();
  }
  // 他デバイスからの反映後に画面全体を再描画するための共通処理
  function refreshAllViews(){
    renderLegend();
    renderRoleFilter();
    renderInputGrid();
    monthLabel.textContent = `${currentDate.getFullYear()}年 ${currentDate.getMonth()+1}月`;
    if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
      renderResultGrid(); renderSummary(); renderWarnings();
    }
  }

  // Roles: chief (師長), subchief (副主任), nurse (看護師), care (介護福祉士)
  const ROLE_LABELS = { chief: '師長', subchief: '副主任', nurse: '看護師', care: '介護福祉士', clerk: '病棟クラーク' };

  let members = [];
  (function initMembers(){
    members.push({ id: 'chief1', name: '師長', role: 'chief', leader: false, nightLeader: false, nightOK: false, newbie: false, parttime: false, ikuji: false, nightOnly: false });
    for(let i=1;i<=3;i++) members.push({ id: 'sub'+i, name: `副主任${i}`, role: 'subchief', leader: true, nightLeader: true, nightOK: true, newbie: false, parttime: false, ikuji: false, nightOnly: false });
    for(let i=1;i<=22;i++){
      const limited = (i>=21) || (i===19||i===20); // 新人 or パート/育短
      members.push({ id: 'nurse'+i, name: `看護師${i}`, role: 'nurse', leader: i<=8, nightLeader: i<=8, nightOK: !limited, newbie: i>=21, parttime: (i===19||i===20), ikuji: false, nightOnly: false });
    }
    for(let i=1;i<=7;i++) members.push({ id: 'care'+i, name: `介護福祉士${i}`, role: 'care', leader: false, nightLeader: false, nightOK: true, newbie: false, parttime: false, ikuji: false, nightOnly: false });
  })();

  // shift types: id, name, short, color, required (per day, for nurse role pool), isOff
  let shiftTypes = [
    { id: 'day', name: '日勤', short: '日', color: 'c-blue', required: 7, isOff: false },
    { id: 'night', name: '夜勤', short: '夜', color: 'c-purple', required: 3, isOff: false },
    { id: 'ake', name: '明け', short: '明', color: 'c-amber', required: 0, isOff: false },
    { id: 'off', name: '休み', short: '休', color: 'c-gray', required: 0, isOff: true },
    { id: 'paid', name: '有給', short: '有', color: 'c-coral', required: 0, isOff: true },
    { id: 'refresh', name: 'リフレッシュ休暇', short: 'リフ', color: 'c-red', required: 0, isOff: true },
    { id: 'amoff', name: '午前休', short: '前休', color: 'c-teal', required: 0, isOff: false },
    { id: 'pmoff', name: '午後休', short: '後休', color: 'c-pink', required: 0, isOff: false },
    { id: 'training', name: '研修', short: '研修', color: 'c-green', required: 0, isOff: false },
    { id: 'free', name: 'フリー', short: 'F', color: 'c-blue', required: 0, isOff: false },
    // 遅出は出勤扱い(workCountに含む)だが、日勤の必要人数(dayType.required・weekendDayReq)には
    // 含めない。required: 0 かつ id !== 'day' のため、必要人数カウント(assignments[...]===dayType.id
    // で判定)からは自動的に除外される。
    { id: 'osoide', name: '遅出', short: '遅出', color: 'c-cyan', required: 0, isOff: false }
  ];
  // 土日の日勤の必要人数（平日は shiftTypes の day.required を使う）。設定画面で変更可
  let weekendDayReq = 6;
  // care role required counts for day/night
  let careRequired = { day: 2, night: 1 };
  // 月の休日数(全員共通の目標)。当月日数 - この値 = 目標勤務日数(明けも勤務に含む)
  let monthlyOffTarget = 9;
  // 夜勤専従スタッフの月間夜勤回数上限。月をまたぐ夜勤(前月末に入り、当月頭が明けだけになるケース)は
  // 前月0.5回・当月0.5回に分割してカウントする(月をまたがない通常の夜勤は1回)ため、0.5刻みで指定する。
  let nightOnlyMax = 9.5;
  // 「夜勤研修中」フラグを付けたスタッフ1人あたり、月に何回夜勤に入ることを目標にするか。
  // 夜勤専従の上限(nightOnlyMax)と違い、こちらは上限ではなく目標(届かなくても強制はしない)。
  let nightTrainingTarget = 4;
  // 連続勤務の上限(明けも勤務に数える)。これを超える勤務は割り当てない
  const MAX_CONSEC = 5;
  // 希望入力用の特殊な希望値: 「夜勤以外」(夜勤だけは避けたいが、日勤等は自動割り振りに任せる)。
  // shiftTypesには含めない(凡例・集計・Excel出力に実際のシフトとして出てしまうのを避けるため)。
  const AVOID_NIGHT_WISH = 'avoidNight';

  let preferences = {};
  let assignments = {};
  let locked = {};
  // 勤務表作成者が「割り振り結果」画面のセルを直接クリックして、業務調整のために手動で
  // 値を変更したセルの目印。本人の希望(preferences)とは別物で、自動割り振り(自動作成)を
  // 実行しても上書きされないよう保護する対象になる(具体的な保護方法はclearMonthData参照)。
  let manualEdit = {};
  let lastWarnings = [];
  // 夜勤NGペア: [memberIdA, memberIdB] の配列。この2人は同じ日の夜勤に同時に割り当てない(相性・スキルバランス等)。
  let nightNgPairs = [];

  const STORAGE_KEY = 'kyufu-tool-v1';
  function saveToStorage(skipCloud){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStatePayload()));
    } catch(e) {}
    if(!skipCloud) scheduleCloudSave();
  }
  function loadFromStorage(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      applyStatePayload(JSON.parse(raw));
      return true;
    } catch(e) { return false; }
  }

  let currentDate = new Date();
  currentDate.setDate(1);
  let activeTab = 'input';
  let roleFilter = 'all';

  const appEl = document.getElementById('app');
  const monthSetupView = document.getElementById('monthSetupView');
  const monthSetupYear = document.getElementById('monthSetupYear');
  const monthSetupMonth = document.getElementById('monthSetupMonth');
  const monthLabel = document.getElementById('monthLabel');
  const legend = document.getElementById('legend');
  const inputGrid = document.getElementById('inputGrid');
  const roleFilterEl = document.getElementById('roleFilter');
  const resultGrid = document.getElementById('resultGrid');
  const summaryGrid = document.getElementById('summaryGrid');
  const warningsEl = document.getElementById('warnings');
  const inputView = document.getElementById('inputView');
  const resultView = document.getElementById('resultView');
  const overlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');

  const colorMap = {
    'c-purple': {50:'#EEEDFE',600:'#534AB7',800:'#3C3489'},
    'c-teal': {50:'#E1F5EE',600:'#0F6E56',800:'#085041'},
    'c-coral': {50:'#FAECE7',600:'#993C1D',800:'#712B13'},
    'c-pink': {50:'#FBEAF0',600:'#993556',800:'#72243E'},
    'c-gray': {50:'#F1EFE8',600:'#5F5E5A',800:'#444441'},
    'c-blue': {50:'#E6F1FB',600:'#185FA5',800:'#0C447C'},
    'c-green': {50:'#EAF3DE',600:'#3B6D11',800:'#27500A'},
    'c-amber': {50:'#FAEEDA',600:'#854F0B',800:'#633806'},
    'c-red': {50:'#FCEBEB',600:'#A32D2D',800:'#791F1F'},
    'c-cyan': {50:'#E3F6F8',600:'#0E7C86',800:'#0A5960'}
  };
  function cv(c, stop){ return colorMap[c] ? colorMap[c][stop] : '#888'; }

  function getKey(y,m,d,memberId){ return `${y}-${m}-${d}-${memberId}`; }
  // 年月日にday日数を加算する(月・年をまたぐ場合も正しく繰り上げる)。
  function addDays(y,m,d,delta){
    const dt = new Date(y,m,d);
    dt.setDate(dt.getDate() + delta);
    return { y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate() };
  }
  // 希望入力で「夜勤」を選んだ時、翌日・翌々日の希望を自動的に補完する。
  // 翌日の「明け」は夜勤を入れた結果として確定するものであり選択の余地がないため、既存の希望があっても上書きする。
  // 翌々日の「休み」はあくまで基本の既定値(人員不足なら夜勤に回ることもある)なので、
  // 既に別の希望やNGが入力済みの日は上書きしない。
  function applyNightFollowupWishes(y,m,d,member){
    const ake = shiftTypes.find(s => s.id === 'ake');
    const off = shiftTypes.find(s => s.isOff && s.id === 'off') || shiftTypes.find(s => s.isOff);
    if(ake){
      const n1 = addDays(y,m,d,1);
      preferences[getKey(n1.y,n1.m,n1.d,member.id)] = { wish: ake.id, ng: false };
    }
    if(off){
      const n2 = addDays(y,m,d,2);
      const key2 = getKey(n2.y,n2.m,n2.d,member.id);
      if(!preferences[key2]){
        preferences[key2] = { wish: off.id, ng: false };
      }
    }
  }
  // 夜勤NGペアの相手が、同じ日に「夜勤」の希望を既に入力していないかを調べる(希望入力時点での注意喚起用)。
  // 自動割り振り側は衝突を検出して調整するが、入力の時点でも気づけるよう、希望入力グリッド・モーダルの
  // 両方からこの関数を使って警告表示を行う。
  function nightNgWishConflictPartners(memberId, y, m, d){
    if(nightNgPairs.length === 0) return [];
    const partners = [];
    nightNgPairs.forEach(pair => {
      let partnerId = null;
      if(pair[0] === memberId) partnerId = pair[1];
      else if(pair[1] === memberId) partnerId = pair[0];
      else return;
      const p = preferences[getKey(y,m,d,partnerId)];
      if(p && !p.ng && p.wish === 'night'){
        const partner = members.find(mm => mm.id === partnerId);
        if(partner) partners.push(partner);
      }
    });
    return partners;
  }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function isWeekend(y,m,d){ const wd = new Date(y,m,d).getDay(); return wd===0 || wd===6; }
  // キーが指定の年月に属するか(月をまたいでassignments/lockedを一括管理するため)
  function isKeyInMonth(key, y, m){
    const parts = key.split('-');
    return Number(parts[0]) === y && Number(parts[1]) === m;
  }
  function hasDataForMonth(y,m){
    return Object.keys(assignments).some(k => isKeyInMonth(k, y, m));
  }
  function clearMonthData(y,m){
    // 業務調整のため手動で確定させたセル(manualEdit)は、自動割り振りをやり直しても
    // 消えない/上書きされないよう、ここでは割り振り結果を消さずに残す。
    Object.keys(assignments).forEach(k => { if(isKeyInMonth(k,y,m) && !manualEdit[k]) delete assignments[k]; });
    Object.keys(locked).forEach(k => { if(isKeyInMonth(k,y,m)) delete locked[k]; });
    // 残しておいたmanualEditセルは、割り振り処理側から見ると「夜勤明け等の自動ロック」と
    // 同じ仕組み(locked)に載せることで、以降の割り振りロジックを一切変更せずに
    // 「このセルは動かさない」を実現する(表示上の区別はmanualEdit自体を別途参照する)。
    Object.keys(manualEdit).forEach(k => {
      if(isKeyInMonth(k,y,m) && (k in assignments)) locked[k] = assignments[k];
    });
  }
  function prevMonthInfo(y,m){
    const prevY = m === 0 ? y - 1 : y;
    const prevM = m === 0 ? 11 : m - 1;
    return { prevY, prevM, prevDays: daysInMonth(prevY, prevM) };
  }
  // 前月末2日分の参照列。現在の月の割り振り判断(連続勤務日数・夜勤明けの引き継ぎ)の根拠を
  // 並べて確認できるようにする。クリックすると前月の実績を直接編集できる。
  const WEEKDAY_NAMES_JA = ['日','月','火','水','木','金','土'];
  function buildPrevRefHeaderCells(y,m){
    const { prevY, prevM, prevDays } = prevMonthInfo(y,m);
    const ths = [];
    [prevDays-1, prevDays].forEach((d, idx) => {
      const th = document.createElement('th');
      const wd = new Date(prevY,prevM,d).getDay();
      th.style.cssText = `border:0.5px solid var(--color-border-tertiary); ${idx===1?'border-right:2px solid var(--color-text-tertiary);':''} padding:4px 2px; background:var(--color-background-secondary); min-width:34px; width:34px; font-weight:500; font-size:10px; color:var(--color-text-tertiary); position:sticky; top:0; z-index:2;`;
      th.innerHTML = `${prevM+1}/${d}<br>${WEEKDAY_NAMES_JA[wd]}`;
      th.title = '前月(クリックで編集できます)';
      ths.push(th);
    });
    return ths;
  }
  function buildPrevRefBodyCells(y,m,mem){
    const { prevY, prevM, prevDays } = prevMonthInfo(y,m);
    const tds = [];
    [prevDays-1, prevDays].forEach((d, idx) => {
      const cell = document.createElement('td');
      cell.style.cssText = `border:0.5px solid var(--color-border-tertiary); ${idx===1?'border-right:2px solid var(--color-text-tertiary);':''} padding:4px 2px; text-align:center; cursor:pointer; font-style:italic;`;
      const stId = assignments[getKey(prevY,prevM,d,mem.id)];
      const st = shiftTypes.find(s => s.id === stId);
      if(st){
        const cd = chiefShift(mem, stId);
        const dc = cd ? cd.color : st.color;
        cell.style.background = cv(dc,50);
        cell.style.color = cv(dc,800);
        cell.textContent = cd ? cd.short : st.short;
      } else {
        cell.textContent = '-';
        cell.style.color = 'var(--color-text-tertiary)';
      }
      cell.title = '前月の割り振り(クリックで編集)';
      cell.addEventListener('click', () => openPrevRefEditModal(prevY,prevM,d,mem));
      tds.push(cell);
    });
    return tds;
  }
  // 前月末の実績をここで書き換えると、今月の自動割り振りが連続勤務日数の起点や夜勤明け引き継ぎの
  // 判定に使うデータが変わるため、今月の割り振り結果が既に生成済みなら再計算して反映する。
  // 希望入力(openPrefModal)の色付きタイルと見た目を揃え、前月末の実績もタップだけで
  // 設定できるようにする。希望・NGという概念は無く単純に「その日の実績」を選ぶだけなので、
  // モード切り替えは無く、常に1つのタイル一覧のみを表示する。
  function openPrevRefEditModal(prevY, prevM, d, member){
    overlay.style.display = 'flex';
    modalContent.innerHTML = '';
    // 色付きの大きいタイルを並べるため、既定より少し幅を広げる(希望入力モーダルと同じ幅)。
    modalContent.style.width = '420px';

    const key = getKey(prevY,prevM,d,member.id);

    const title = document.createElement('p');
    title.style.cssText = `font-weight:500; font-size:16px; margin:0 0 4px;`;
    title.textContent = `${prevM+1}月${d}日 - ${member.name}(前月)`;
    modalContent.appendChild(title);

    const sub = document.createElement('p');
    sub.style.cssText = `font-size:13px; color:var(--color-text-secondary); margin:0 0 10px;`;
    sub.textContent = '前月末の実績を設定します。今月の連続勤務日数・夜勤明けの判定に反映されます。';
    modalContent.appendChild(sub);

    function syncAfterChange(){
      closeModal();
      renderInputGrid();
      if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
        autoAssign();
      }
      saveToStorage();
    }

    const grid = document.createElement('div');
    grid.style.cssText = `display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px;`;
    modalContent.appendChild(grid);

    function makeTile({ colorKey, label, selected, onClick }){
      const tile = document.createElement('button');
      tile.style.cssText = `display:flex; align-items:center; justify-content:center; min-height:56px; padding:10px 4px; border:2px solid ${cv(colorKey,600)}; border-radius:var(--border-radius-md); background:${selected ? cv(colorKey,50) : 'var(--color-background-primary)'}; color:${cv(colorKey,800)}; font-size:14px; font-weight:600; text-align:center;`;
      tile.textContent = label;
      tile.addEventListener('click', onClick);
      grid.appendChild(tile);
    }

    const currentStId = assignments[key];
    availableShiftOptionsFor(member).forEach(st => {
      const cd = chiefShift(member, st.id);
      const dispName = (member.role === 'chief' && st.id === 'night') ? '管理当直' : st.name;
      makeTile({
        colorKey: cd ? cd.color : st.color,
        label: dispName,
        selected: currentStId === st.id,
        onClick: () => {
          assignments[key] = st.id;
          delete locked[key];
          syncAfterChange();
        },
      });
    });
    makeTile({
      colorKey: 'c-gray',
      label: '未設定',
      selected: !currentStId,
      onClick: () => {
        delete assignments[key];
        delete locked[key];
        syncAfterChange();
      },
    });

    const closeBtn = document.createElement('button');
    closeBtn.style.cssText = `width:100%;`;
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', closeModal);
    modalContent.appendChild(closeBtn);
  }

  function renderLegend(){
    legend.innerHTML = '';
    shiftTypes.forEach(st => {
      const pill = document.createElement('span');
      pill.style.cssText = `display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--border-radius-md); font-size:12px; background:${cv(st.color,50)}; color:${cv(st.color,800)};`;
      let label = st.name;
      if(!st.isOff && st.required > 0) label += ` (看護師最低${st.required}人${st.id==='day' ? `・土日${weekendDayReq}人` : ''})`;
      pill.textContent = label;
      legend.appendChild(pill);
    });
    // 「夜勤以外」は実際のシフトではなく希望入力専用の特殊な希望なので、shiftTypesとは別に凡例へ追加する。
    const avoidPill = document.createElement('span');
    avoidPill.style.cssText = `display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--border-radius-md); font-size:12px; background:${cv('c-cyan',50)}; color:${cv('c-cyan',800)};`;
    avoidPill.textContent = '夜勤以外(希望入力専用)';
    legend.appendChild(avoidPill);
  }

  function renderRoleFilter(){
    roleFilterEl.innerHTML = '';
    const roles = [['all','全員'],['chief','師長'],['subchief','副主任'],['nurse','看護師'],['care','介護福祉士'],['clerk','病棟クラーク']];
    roles.forEach(([key,label]) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = `padding:4px 10px; font-size:12px;`;
      if(roleFilter === key){
        btn.style.borderColor = 'var(--color-border-info)';
        btn.style.color = 'var(--color-text-info)';
      }
      btn.addEventListener('click', () => { roleFilter = key; renderRoleFilter(); renderInputGrid(); });
      roleFilterEl.appendChild(btn);
    });
  }

  function visibleMembers(){
    if(roleFilter === 'all') return members;
    return members.filter(mem => mem.role === roleFilter);
  }

  function chiefShift(mem, stId){
    if(mem.role !== 'chief') return null;
    if(stId === 'night') return { short: '管夜', color: 'c-teal' };
    if(stId === 'ake')   return { short: '管明', color: 'c-green' };
    return null;
  }

  function memberTag(mem){
    if(mem.nightOnly) return ` (${ROLE_LABELS[mem.role]}・夜専)`;
    let extra = '';
    if(mem.parttime) extra = '・パート';
    else if(mem.ikuji) extra = '・育短';
    else if(mem.newbie) extra = '・新人';
    return ` (${ROLE_LABELS[mem.role]}${extra})`;
  }

  function renderInputGrid(){
    inputGrid.innerHTML = '';
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    monthLabel.textContent = `${y}年 ${m+1}月`;
    const days = daysInMonth(y,m);
    const mems = visibleMembers();
    const weekdayNames = ['日','月','火','水','木','金','土'];

    const table = document.createElement('table');
    table.style.cssText = `border-collapse:collapse; font-size:12px;`;

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    // 縦にも横にもスクロールするため、左上の角セルだけは常に見えるよう上下左右ともに固定する
    // (行ヘッダー・列ヘッダーより手前に来るようz-indexを一段高くする)。
    corner.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px; background:var(--color-background-secondary); position:sticky; left:0; top:0; min-width:90px; width:90px; z-index:3;`;
    corner.textContent = '職員 \\ 日付';
    headRow.appendChild(corner);
    buildPrevRefHeaderCells(y,m).forEach(th => headRow.appendChild(th));
    for(let d=1; d<=days; d++){
      const wd = new Date(y,m,d).getDay();
      const th = document.createElement('th');
      // メンバーが多く縦に長い表になっても日付が見えるよう、見出し行を上に固定する
      th.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; background:var(--color-background-secondary); min-width:30px; width:30px; font-weight:500; font-size:11px; color:${wd===0?cv('c-red',600):(wd===6?cv('c-blue',600):'var(--color-text-primary)')}; position:sticky; top:0; z-index:2;`;
      th.innerHTML = `${d}<br>${weekdayNames[wd]}`;
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    let dragSrcId = null;
    mems.forEach((mem, memIdx) => {
      const row = document.createElement('tr');
      row.draggable = true;
      // 1行ごとに背景色を交互に変え、日付列が多くても目で追いやすくする。
      const rowBg = memIdx % 2 === 0 ? 'var(--color-background-primary)' : 'var(--color-background-secondary)';
      row.style.background = rowBg;

      const nameCell = document.createElement('td');
      nameCell.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px; font-weight:500; font-size:11px; position:sticky; left:0; background:${rowBg}; z-index:1; white-space:nowrap;`;

      // 表示中のメンバーが何人いるか一目で分かるよう、名前の前に表内の通し番号を振る
      // (絞り込み中はその絞り込み内での番号になる=最後の行の番号がそのまま人数になる)。
      const numSpan = document.createElement('span');
      numSpan.textContent = `${memIdx+1}. `;
      numSpan.style.cssText = `color:var(--color-text-tertiary); font-weight:400;`;
      const handle = document.createElement('span');
      handle.textContent = '⠿';
      handle.style.cssText = `color:var(--color-text-tertiary); margin-right:4px; user-select:none; cursor:grab;`;
      const nameText = document.createElement('span');
      nameText.textContent = mem.name + memberTag(mem);
      nameText.style.cssText = `cursor:pointer; text-decoration-line:underline; text-decoration-style:dotted; text-underline-offset:2px;`;
      nameText.addEventListener('click', (e) => { e.stopPropagation(); openMembersModal(mem.id); });
      nameCell.appendChild(numSpan);
      nameCell.appendChild(handle);
      nameCell.appendChild(nameText);

      row.addEventListener('dragstart', (e) => {
        dragSrcId = mem.id;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => { row.style.opacity = '0.4'; }, 0);
      });
      row.addEventListener('dragend', () => {
        row.style.opacity = '';
        nameCell.style.background = rowBg;
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        nameCell.style.background = 'var(--color-background-secondary)';
      });
      row.addEventListener('dragleave', () => {
        nameCell.style.background = rowBg;
      });
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        nameCell.style.background = rowBg;
        if(!dragSrcId || dragSrcId === mem.id) return;
        const srcIdx = members.findIndex(x => x.id === dragSrcId);
        const dstIdx = members.findIndex(x => x.id === mem.id);
        if(srcIdx === -1 || dstIdx === -1) return;
        const [moved] = members.splice(srcIdx, 1);
        members.splice(dstIdx, 0, moved);
        dragSrcId = null;
        renderInputGrid();
        if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){ renderResultGrid(); renderSummary(); }
        saveToStorage();
      });

      row.appendChild(nameCell);
      buildPrevRefBodyCells(y,m,mem).forEach(td => row.appendChild(td));

      for(let d=1; d<=days; d++){
        const cell = document.createElement('td');
        cell.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; text-align:center; cursor:pointer;`;
        const key = getKey(y,m,d,mem.id);
        const pref = preferences[key];
        if(manualEdit[key]){
          // 業務調整で確定済みのセルは、希望ではなく実際に確定した内容を表示する
          // (枠だけでは何が確定したのか分からない、という指摘への対応)。
          const confirmedSt = shiftTypes.find(s => s.id === assignments[key]);
          if(confirmedSt){
            const cd = chiefShift(mem, confirmedSt.id);
            const dc = cd ? cd.color : confirmedSt.color;
            cell.style.background = cv(dc,50);
            cell.style.color = cv(dc,800);
            cell.textContent = cd ? cd.short : confirmedSt.short;
          } else {
            cell.textContent = '-';
            cell.style.color = 'var(--color-text-tertiary)';
          }
        } else if(pref && pref.ng){
          cell.style.background = cv('c-red',50);
          cell.style.color = cv('c-red',800);
          cell.textContent = 'NG';
        } else if(pref && pref.wish === AVOID_NIGHT_WISH){
          cell.style.background = cv('c-cyan',50);
          cell.style.color = cv('c-cyan',800);
          cell.textContent = '非夜';
        } else if(pref && pref.wish){
          const st = shiftTypes.find(s => s.id === pref.wish);
          if(st){
            const cd = chiefShift(mem, pref.wish);
            const dc = cd ? cd.color : st.color;
            cell.style.background = cv(dc,50);
            cell.style.color = cv(dc,800);
            cell.textContent = cd ? cd.short : st.short;
          }
        } else {
          cell.textContent = '-';
          cell.style.color = 'var(--color-text-tertiary)';
        }
        // 本人の希望(休み等の希望休だけでなく、日勤・夜勤等の希望の勤務も含む)は、
        // 枠線で囲んで一目で分かるようにする。
        if(!manualEdit[key] && pref && pref.wish){
          cell.style.border = `1.5px solid ${cv('c-gray',600)}`;
        }
        // 夜勤希望が夜勤NGペアの相手と同日に重なっている場合、セルに警告マークを重ねて表示する。
        if(pref && !pref.ng && pref.wish === 'night'){
          const conflictPartners = nightNgWishConflictPartners(mem.id, y, m, d);
          if(conflictPartners.length > 0){
            cell.style.position = 'relative';
            cell.style.boxShadow = `inset 0 0 0 1.5px ${cv('c-red',600)}`;
            cell.title = `夜勤NGペア注意: ${conflictPartners.map(p=>p.name).join('・')} も同日に夜勤希望`;
            const badge = document.createElement('span');
            badge.textContent = '⚠';
            badge.style.cssText = `position:absolute; top:-2px; right:0; font-size:9px; line-height:1; color:${cv('c-red',600)};`;
            cell.appendChild(badge);
          }
        }
        // 師長が勤務調整として確定させたセルは、希望とは別にセル上部の「・」で分かるようにする
        // (割り振り結果画面の表示と同じ考え方。希望入力画面からでも一目で分かるようにする)。
        if(manualEdit[key]){
          cell.style.position = 'relative';
          const dot = document.createElement('span');
          dot.textContent = '・';
          dot.style.cssText = `position:absolute; top:0px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:900; line-height:1; color:${cv('c-purple',600)};`;
          cell.appendChild(dot);
          const confirmedSt = shiftTypes.find(s => s.id === assignments[key]);
          const manualTitle = `勤務調整済み: ${confirmedSt ? confirmedSt.name : ''} (クリックで確認・変更)`;
          cell.title = cell.title ? `${cell.title} ／ ${manualTitle}` : manualTitle;
        }
        cell.addEventListener('click', () => openPrefModal(y,m,d,mem));
        row.appendChild(cell);
      }
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    inputGrid.appendChild(table);
  }

  function availableShiftOptionsFor(mem){
    if(mem.nightOnly) return shiftTypes.filter(s => s.id === 'night' || s.id === 'ake' || s.isOff);
    if(mem.role === 'nurse' && (mem.newbie || mem.parttime || mem.ikuji)){
      return shiftTypes.filter(s => s.id === 'day' || s.id === 'amoff' || s.id === 'pmoff' || s.id === 'training' || s.id === 'free' || s.id === 'osoide' || s.isOff);
    }
    let opts = shiftTypes;
    if(mem.role !== 'nurse' && mem.role !== 'subchief'){
      opts = opts.filter(s => s.id !== 'free'); // フリーは看護師・副主任のみ
    }
    // 夜勤・夜勤Lのどちらも不可(=夜勤に一切入れない)な人には「夜勤」希望を選ばせない。
    // 選べてしまうと自動割り振りでは絶対に叶わない希望になり、後段の警告表示が実態と食い違ってしまう。
    // 師長は管理当直として別枠で扱われるため対象外。
    if(mem.role !== 'chief' && !mem.nightOK && !mem.nightLeader){
      opts = opts.filter(s => s.id !== 'night');
    }
    return opts;
  }

  function openPrefModal(y,m,d,member){
    overlay.style.display = 'flex';
    modalContent.innerHTML = '';
    // 色付きの大きいタイルを並べるため、既定より少し幅を広げる。
    modalContent.style.width = '420px';

    const key = getKey(y,m,d,member.id);
    const daysInThisMonth = daysInMonth(y,m);
    const weekdayNames = ['日','月','火','水','木','金','土'];
    let mode = 'wish'; // 'wish' = 本人の希望を入力 / 'confirm' = 師長が勤務調整として設定

    const title = document.createElement('p');
    title.style.cssText = `font-weight:500; font-size:16px; margin:0 0 10px;`;
    title.textContent = `${m+1}/${d}(${weekdayNames[new Date(y,m,d).getDay()]}) - ${member.name}`;
    modalContent.appendChild(title);

    // ---- モード切り替え(本人の希望 / 師長の業務調整) ----
    // 1つのタイル一覧で両方を扱うと押し間違えやすいため、タブで先にモードを選んでもらい、
    // タップ操作そのものは大きな色付きタイルをそのまま押すだけで完結するようにする。
    const modeTabs = document.createElement('div');
    modeTabs.style.cssText = `display:flex; gap:6px; margin-bottom:10px;`;
    const wishTabBtn = document.createElement('button');
    wishTabBtn.textContent = '本人の希望';
    const confirmTabBtn = document.createElement('button');
    confirmTabBtn.textContent = '勤務調整(師長用)';
    [wishTabBtn, confirmTabBtn].forEach(b => { b.style.cssText = `flex:1; padding:8px 6px; font-size:12px;`; });
    modeTabs.appendChild(wishTabBtn);
    modeTabs.appendChild(confirmTabBtn);
    modalContent.appendChild(modeTabs);

    const statusArea = document.createElement('div');
    modalContent.appendChild(statusArea);

    const gridArea = document.createElement('div');
    modalContent.appendChild(gridArea);

    function updateModeTabStyles(){
      const activeColor = mode === 'confirm' ? cv('c-purple',600) : 'var(--color-border-info)';
      const activeText = mode === 'confirm' ? cv('c-purple',800) : 'var(--color-text-info)';
      wishTabBtn.style.borderColor = mode === 'wish' ? activeColor : '';
      wishTabBtn.style.color = mode === 'wish' ? activeText : '';
      wishTabBtn.style.fontWeight = mode === 'wish' ? '500' : '';
      confirmTabBtn.style.borderColor = mode === 'confirm' ? activeColor : '';
      confirmTabBtn.style.color = mode === 'confirm' ? activeText : '';
      confirmTabBtn.style.fontWeight = mode === 'confirm' ? '500' : '';
    }

    function syncAfterChange(){
      closeModal();
      renderInputGrid();
      if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
        autoAssign();
        renderResultGrid(); renderSummary(); renderWarnings();
      }
      saveToStorage();
    }

    function confirmManual(st){
      assignments[key] = st.id;
      delete locked[key];
      manualEdit[key] = true;

      const akeType = shiftTypes.find(s => s.id === 'ake');
      const offType = shiftTypes.find(s => s.isOff);
      if(st.id === 'night'){
        if(d+1 <= daysInThisMonth && akeType){
          locked[getKey(y,m,d+1,member.id)] = akeType.id;
          assignments[getKey(y,m,d+1,member.id)] = akeType.id;
        }
        if(d+2 <= daysInThisMonth && offType){
          locked[getKey(y,m,d+2,member.id)] = offType.id;
          assignments[getKey(y,m,d+2,member.id)] = offType.id;
        }
      }
      closeModal();
      renderInputGrid();
      if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){ renderResultGrid(); renderSummary(); }
      saveToStorage();
    }

    // 夜勤NGペアの相手が、この日に既に「夜勤」希望を出している場合は、選ぶ前に気づけるよう警告を表示する。
    const nightNgConflicts = nightNgWishConflictPartners(member.id, y, m, d);

    function renderStatus(){
      statusArea.innerHTML = '';
      if(mode === 'confirm'){
        const p = document.createElement('p');
        p.style.cssText = `font-size:12px; color:${cv('c-purple',800)}; background:${cv('c-purple',50)}; border-radius:var(--border-radius-md); padding:6px 10px; margin:0 0 8px;`;
        p.textContent = manualEdit[key]
          ? `現在の勤務調整: ${(shiftTypes.find(s => s.id === assignments[key]) || {}).name || ''}。選び直すと上書きされます。`
          : 'タイルを選ぶと、本人の希望とは別にこの日の勤務を「勤務調整」として直接設定します(自動割り振りでも保持されます)。';
        statusArea.appendChild(p);
      }
      if(nightNgConflicts.length > 0){
        const warn = document.createElement('p');
        warn.style.cssText = `font-size:12px; color:${cv('c-red',800)}; background:${cv('c-red',50)}; border-radius:var(--border-radius-md); padding:8px 10px; margin:0 0 8px;`;
        warn.textContent = `⚠ 夜勤NGペア注意: ${nightNgConflicts.map(p=>p.name).join('・')} がこの日に夜勤希望を入力済みです(同時に夜勤へは割り振られません)`;
        statusArea.appendChild(warn);
      }
    }

    // 「夜勤以外」希望: 夜勤に入れる属性を持つ人(夜勤専従・師長・新人・パート/育短は対象外)にのみ表示。
    // 夜勤だけは避けたいが、日勤等どのシフトになるかは自動割り振りに任せたい、という希望を表現する。
    // 実際のシフト種別ではないため、業務調整(確定)モードには出さない。
    const canAvoidNight = !member.nightOnly &&
      !(member.role === 'nurse' && (member.newbie || member.parttime || member.ikuji)) &&
      (member.role === 'chief' || member.nightOK || member.nightLeader);

    function renderGrid(){
      gridArea.innerHTML = '';
      const grid = document.createElement('div');
      grid.style.cssText = `display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px;`;

      function makeTile({ colorKey, label, selected, warn, onClick }){
        const tile = document.createElement('button');
        tile.style.cssText = `position:relative; display:flex; align-items:center; justify-content:center; min-height:56px; padding:10px 4px; border:2px solid ${cv(colorKey,600)}; border-radius:var(--border-radius-md); background:${selected ? cv(colorKey,50) : 'var(--color-background-primary)'}; color:${cv(colorKey,800)}; font-size:14px; font-weight:600; text-align:center;`;
        tile.textContent = label;
        if(warn){
          const badge = document.createElement('span');
          badge.textContent = '⚠';
          badge.style.cssText = `position:absolute; top:2px; right:4px; font-size:10px; color:${cv('c-red',600)};`;
          tile.appendChild(badge);
          tile.title = warn;
        }
        tile.addEventListener('click', onClick);
        grid.appendChild(tile);
      }

      const currentWish = preferences[key];

      availableShiftOptionsFor(member).forEach(st => {
        const cd = chiefShift(member, st.id);
        const dispName = (member.role === 'chief' && st.id === 'night') ? '管理当直' : st.name;
        const isNightConflict = st.id === 'night' && nightNgConflicts.length > 0;
        const selected = mode === 'wish'
          ? !!(currentWish && !currentWish.ng && currentWish.wish === st.id)
          : (manualEdit[key] && assignments[key] === st.id);
        makeTile({
          colorKey: cd ? cd.color : st.color,
          label: dispName,
          selected,
          warn: isNightConflict ? `夜勤NGペア注意: ${nightNgConflicts.map(p=>p.name).join('・')} も同日に夜勤希望` : null,
          onClick: () => {
            if(mode === 'wish'){
              preferences[key] = { wish: st.id, ng: false };
              if(st.id === 'night'){
                applyNightFollowupWishes(y,m,d,member);
              }
              syncAfterChange();
            } else {
              confirmManual(st);
            }
          },
        });
      });

      if(mode === 'wish'){
        if(canAvoidNight){
          makeTile({
            colorKey: 'c-cyan',
            label: '夜勤以外',
            selected: !!(currentWish && !currentWish.ng && currentWish.wish === AVOID_NIGHT_WISH),
            onClick: () => {
              preferences[key] = { wish: AVOID_NIGHT_WISH, ng: false };
              syncAfterChange();
            },
          });
        }
        makeTile({
          colorKey: 'c-gray',
          label: '未設定',
          selected: !currentWish,
          onClick: () => {
            delete preferences[key];
            syncAfterChange();
          },
        });
      }

      gridArea.appendChild(grid);
    }

    wishTabBtn.addEventListener('click', () => { mode = 'wish'; updateModeTabStyles(); renderStatus(); renderGrid(); });
    confirmTabBtn.addEventListener('click', () => { mode = 'confirm'; updateModeTabStyles(); renderStatus(); renderGrid(); });

    updateModeTabStyles();
    renderStatus();
    renderGrid();

    const closeBtn = document.createElement('button');
    closeBtn.style.cssText = `width:100%;`;
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', closeModal);
    modalContent.appendChild(closeBtn);
  }

  function closeModal(){
    overlay.style.display = 'none';
    modalContent.innerHTML = '';
    modalContent.style.width = '360px'; // シフト設定など幅を広げるモーダルがあるため、既定幅に戻しておく
  }

  // ---- Auto assignment logic ----
  // 1回分の自動割り振りを生成する(assignments/locked/lastWarningsを書き換えるのみで、
  // 画面の再描画や保存は行わない)。乱数によるタイブレークを各所で使っているため、
  // 呼ぶたびに(同じ希望入力でも)結果が多少変わりうる。
  function runAssignmentAttempt(){
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const days = daysInMonth(y,m);
    // 前月の最終日(前月末2日間の勤務)を参照して月初の連勤・明け・休みを引き継ぐための情報
    const prevY = m === 0 ? y - 1 : y;
    const prevM = m === 0 ? 11 : m - 1;
    const prevDays = daysInMonth(prevY, prevM);
    clearMonthData(y,m);
    lastWarnings = [];

    const offType = shiftTypes.find(s => s.isOff);
    const akeType = shiftTypes.find(s => s.id === 'ake');
    const nightType = shiftTypes.find(s => s.id === 'night');
    const dayType = shiftTypes.find(s => s.id === 'day');

    // 副主任も看護師としてカウント(必要人数プールに含む)
    function inNursePool(mem){ return mem.role === 'nurse' || mem.role === 'subchief'; }
    const nurses = members.filter(inNursePool);
    const careStaff = members.filter(mem => mem.role === 'care');
    const subchiefs = members.filter(mem => mem.role === 'subchief');
    const chief = members.find(mem => mem.role === 'chief');
    // 病棟クラークは看護師・介護福祉士の必要人数カウント対象外の事務職。夜勤には入らず、
    // 師長と同じ「平日基本日勤・土日基本休み」の既定パターンを使う(複数人いてよいため配列で持つ)。
    const clerkMembers = members.filter(mem => mem.role === 'clerk');

    const countableNurses = nurses.filter(mem => !mem.newbie && !mem.parttime && !mem.ikuji);
    const limitedNurses = nurses.filter(mem => mem.newbie || mem.parttime || mem.ikuji);

    const workCount = {};
    const dayCount = {};   // これまでに割り当てた日勤の回数(日勤の偏りを平坦化するため)
    const nightCount = {}; // これまでに割り当てた夜勤の回数(夜勤の偏りを平坦化するため)
    const nightOnlyCount = {}; // 夜勤専従の月間夜勤回数カウント
    // 「夜勤研修中」フラグの人を、月の目標回数(nightTrainingTarget)に向けて按分するための、
    // その日時点での目安回数。日ごとのループ内で更新し、nightPriorityから参照する。
    let curNightTrainingPacedTarget = 0;
    const consec = {}; // 前日までの連続勤務日数(明けも含む)
    const runRand = {}; // この実行ごとの乱数。同順位(タイ)の並びをランダムにし、押すたびに結果を変える
    // consecは前月末の実データから逆算する(前月分が無い場合のみ0〜3のランダムで散らす)。
    // これで前月末に夜勤・連勤していた人を月初にいきなり働かせすぎない。
    function computeInitialConsec(mem){
      const lastKey = getKey(prevY, prevM, prevDays, mem.id);
      if(!(lastKey in assignments)) return Math.floor(Math.random()*4); // 前月データが無ければ従来通りランダム
      let c = 0, dd = prevDays, yy = prevY, mm = prevM;
      while(c < MAX_CONSEC){
        const aId = assignments[getKey(yy,mm,dd,mem.id)];
        if(aId === undefined) break;
        const st = shiftTypes.find(s => s.id === aId);
        if(!st || st.isOff) break;
        c++;
        dd--;
        if(dd < 1){ mm--; if(mm < 0){ mm = 11; yy--; } dd = daysInMonth(yy,mm); }
      }
      return c;
    }
    const newbieRotate = { idx: 0 }; // 新人同士の休みが重なった時、誰を休みのまま残すかを順番に回す
    const limitedRotate = { idx: 0 }; // パート・育短同士の休みが重なった時、誰を休みのまま残すかを順番に回す
    function initState(){
      clearMonthData(y,m); lastWarnings = [];
      newbieRotate.idx = 0;
      limitedRotate.idx = 0;
      // 前月末が夜勤だった人は、月初1日目を「明け」に固定して引き継ぐ
      members.forEach(mem => {
        if(assignments[getKey(prevY,prevM,prevDays,mem.id)] === nightType?.id && akeType){
          locked[getKey(y,m,1,mem.id)] = akeType.id;
        }
      });
      members.forEach(mem => {
        workCount[mem.id] = 0; dayCount[mem.id] = 0; nightCount[mem.id] = 0;
        // 前月末に夜勤専従が夜勤入りし、当月頭が明けだけの人は、その1回分の負荷を
        // 前月0.5・当月0.5に分割する(前月側の0.5は日々の集計処理側で加算される)。
        const carriedOverNight = mem.nightOnly && assignments[getKey(prevY,prevM,prevDays,mem.id)] === nightType?.id;
        nightOnlyCount[mem.id] = carriedOverNight ? 0.5 : 0;
        consec[mem.id] = computeInitialConsec(mem); runRand[mem.id] = Math.random();
      });
    }
    const newbieMembers = nurses.filter(mem => mem.newbie);
    // パート・育短(新人と同じく土日も勤務対象)は同じペース計算のため勤務日・休日が重なりがち。新人と同様にズラす対象。
    const weekdayLimitedMembers = nurses.filter(mem => (mem.parttime || mem.ikuji) && !mem.newbie);
    // グループ内の全員に均等な位相オフセットを持たせ、「休みたくなるタイミング」自体を構造的にズラす。
    // 同じペース計算式のままだと全員が同じ日に休みたくなるため、+側/-側に均等配置してタイミングを分散させる。
    function computePhaseOffsets(group){
      const offsets = {};
      // 隣接メンバーの差がちょうど1(勤務日1日分)になるよう±(n-1)/2の範囲に均等配置。
      // 差が1未満だと、後段のworkCount(整数)との比較でオフセットの効果が実質消えてしまう。
      group.forEach((mem, idx) => { offsets[mem.id] = group.length > 1 ? (idx - (group.length - 1) / 2) : 0; });
      return offsets;
    }
    const newbiePhaseOffset = computePhaseOffsets(newbieMembers);
    const limitedPhaseOffset = computePhaseOffsets(weekdayLimitedMembers);
    // オフセットだけでは避けきれなかった重なりについて、誰を「今回は休みのまま」にするかを公平に順番で回す仕上げ処理。
    // (常に同じ人を優先すると、その人だけがいつも重ならず得をしてしまうため)
    // capFn(mem): そのメンバーが「これ以上連勤したくない」と考える連勤数の上限。省略時はMAX_CONSEC-1(全員共通)。
    // 休みが重なった相手を無理に働かせ直す際も、この上限(5連勤にはしない)を守ったまま行う。
    function pickStaggeredOff(group, rotateState, wantsOffFn, d, assignedToday, capFn){
      if(group.length < 2) return null;
      const cap = capFn || (() => MAX_CONSEC - 1);
      const pending = group.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d));
      const decisions = pending.map(mem => ({ mem, wantsOff: wantsOffFn(mem) }));
      const offGroup = decisions.filter(x => x.wantsOff);
      if(offGroup.length > 1){
        let chosen = null;
        for(let i=0; i<group.length; i++){
          const idx = (rotateState.idx + i) % group.length;
          const cand = group[idx];
          if(offGroup.some(x => x.mem.id === cand.id)){ chosen = cand; rotateState.idx = (idx + 1) % group.length; break; }
        }
        offGroup.forEach(x => {
          if(!chosen || x.mem.id !== chosen.id){
            // 個人ごとの目標勤務日数(有給・リフレッシュ休暇分を差し引いたpersonTarget)を基準に、まだ働ける人は働かせ直す。
            if(consec[x.mem.id] < cap(x.mem) && workCount[x.mem.id] < personTarget(x.mem)) x.wantsOff = false;
          }
        });
      }
      return decisions;
    }

    // 平坦化用: 平日の常勤(新人・短時間除く)日勤人数の1日あたり上限。
    // パス1(測定)では null = 上限なし。パス2でパス1の月平均から算出してセットする。
    const countableSet = new Set(countableNurses.filter(mem => !mem.nightOnly).map(mem => mem.id));
    let dayCapFn = null;
    let dayFloorFn = null; // 平日の常勤日勤人数の1日あたり下限(谷の底上げ用)。パス2でセット

    const targetWork = days - monthlyOffTarget; // 目標勤務日数

    function isNG(mem,d){ const p = preferences[getKey(y,m,d,mem.id)]; return p && p.ng; }
    function wish(mem,d){ const p = preferences[getKey(y,m,d,mem.id)]; return p ? p.wish : null; }
    // 有給・リフレッシュ休暇は月の休み目標(monthlyOffTarget)とは別枠として扱う。これらの希望を
    // 入れた日数分だけ目標勤務日数を減らし(その分働かなくてよくする)、通常の休み日数(targetWork由来)
    // はいつも通り確保する。希望(preferences)は月をまたいでも安定した入力値なので、実行の途中で
    // 変わらず何度参照しても同じ結果になる。
    const SEPARATE_LEAVE_IDS = ['paid', 'refresh'];
    function separateLeaveCount(mem){
      let c = 0;
      for(let d = 1; d <= days; d++){
        if(SEPARATE_LEAVE_IDS.includes(wish(mem,d))) c++;
      }
      return c;
    }
    function personTarget(mem){
      return targetWork - separateLeaveCount(mem);
    }
    // 指定シフト(targetId)への割り当てが本人の希望と衝突するか。
    // 具体的な別シフトの希望がある場合のみ衝突とみなす。休み希望は(人員不足時の最終手段としては)
    // 衝突とみなさない。「夜勤以外」希望は、夜勤への割り当てとだけ衝突する(それ以外は衝突なし)。
    function conflictsWithWish(mem, d, targetId){
      const w = wish(mem, d);
      if(!w || w === targetId) return false;
      if(w === AVOID_NIGHT_WISH) return targetId === nightType?.id;
      const wt = shiftTypes.find(s => s.id === w);
      return !(wt && wt.isOff);
    }
    // 夜勤NGペア: この日、既にペアの相手が夜勤に入っているか(相性・スキルバランス等で同時起用を避けたい場合)。
    // 通常の希望と同様、人員不足の最終手段(誰でも候補)では守れないことがある。
    function hasNightPairConflict(mem, d){
      if(nightNgPairs.length === 0) return false;
      return nightNgPairs.some(pair => {
        let partnerId = null;
        if(pair[0] === mem.id) partnerId = pair[1];
        else if(pair[1] === mem.id) partnerId = pair[0];
        else return false;
        return assignments[getKey(y,m,d,partnerId)] === nightType?.id;
      });
    }
    // 副主任同士はなるべく同じ夜勤に重ならないようにする(副主任が同時に持ち場を離れないための配慮)。
    // 通常の希望と同様、人員不足の最終手段(誰でも候補)では守れないことがある。
    function hasSubchiefNightConflict(mem, d){
      if(mem.role !== 'subchief') return false;
      return members.some(other => other.id !== mem.id && other.role === 'subchief' && assignments[getKey(y,m,d,other.id)] === nightType?.id);
    }
    // 夜勤希望が通らず日勤に振り替えた理由を、その日の実際の夜勤充足状況から都度判定する。
    // (以前は理由を「夜勤が埋まっていたため」に固定していたが、夜勤対応不可・連勤上限などで
    // そもそも候補にすらなれなかった場合にも同じ文言が出てしまい、同じ日の「夜勤看護師が不足」
    // という警告と矛盾する表示になっていた)
    function nightWishOverrideReason(d){
      const nightNowCount = members.filter(o => inNursePool(o) && assignments[getKey(y,m,d,o.id)] === nightType?.id).length;
      return nightNowCount >= (nightType?.required || 0) ? '夜勤人員が充足していたため' : '夜勤の勤務条件(夜勤対応可否・連勤上限等)を満たせなかったため';
    }
    // 今日勤務に入れるか(6連勤を禁止)
    function canWork(mem){ return consec[mem.id] < MAX_CONSEC; }
    // 日勤に新たに入れるか。介護福祉士は連勤の絶対上限が4日(他のスタッフより1日厳しい)なので、
    // 必要人数を満たすための最終手段としての穴埋めであっても、この上限を超えさせない
    // (夜勤+明けが絡む連勤はcanStartNightの基準を使うため、ここでは対象外)。
    function canWorkDay(mem){
      if(mem.role === 'care') return consec[mem.id] < MAX_CONSEC - 1;
      return canWork(mem);
    }
    // 新たに夜勤を割り当ててよいか: 夜勤の翌日は必ず「明け」が付く(ロックで強制)ため、
    // 夜勤当日+翌日の明けの2日分を加えても5連勤を超えないよう、通常のcanWorkより1日分厳しくする。
    // 介護福祉士の連勤上限(4日)は日勤主体の連勤を想定したもので、夜勤+明けが絡む場合は
    // 他の夜勤対応スタッフと同じ基準(この時点で3連勤まで＝夜勤+明けを含め最大5連勤)を使う。
    function canStartNight(mem){ return consec[mem.id] < MAX_CONSEC - 1; }
    // 夜勤に入れるか: nightOK属性が必要(夜勤リーダー可は夜勤可とみなす)
    function canNight(mem){ return mem.nightOnly || mem.nightOK || mem.nightLeader; }
    // 前日が「明け」だったか(=夜勤翌々日にあたる日)。この日は日勤には入れず、
    // 人員不足時のみ「明け→夜勤」で再度夜勤に入れる候補として残す(休みがデフォルト)。
    // 月初1日目(d===1)は前月末日を参照する(月をまたいだ引き継ぎ)。
    function justHadAke(mem,d){
      if(d > 1) return assignments[getKey(y,m,d-1,mem.id)] === akeType?.id;
      return assignments[getKey(prevY,prevM,prevDays,mem.id)] === akeType?.id;
    }
    // この人に今日割り当てると5連勤(MAX_CONSEC)に達してしまうか。5連勤は「極力回避」の対象なので、
    // 目標休日数の達成状況より優先して後回しにする(他に候補がいなければ最終的には選ばれる=必要人数は確保される)。
    function wouldHitConsecCap(mem){ return consec[mem.id] >= MAX_CONSEC - 1; }
    // この人に今日割り当てると4連勤目に入ってしまうか。5連勤ほど厳格ではないが、4連勤も
    // 「なるべく減らしたい」対象なので、5連勤回避の次に優先して後回しにする(他に候補がいなければ選ばれる)。
    function wouldHitFourConsec(mem){ return consec[mem.id] >= MAX_CONSEC - 2; }
    // 勤務割り当ての優先順位: 5連勤になる人を後回し→4連勤になる人を後回し→目標休日数を満たせていない人→連勤が短い人→勤務総数が少ない人
    function workPriority(a,b){
      const aCap = wouldHitConsecCap(a) ? 1 : 0;
      const bCap = wouldHitConsecCap(b) ? 1 : 0;
      if(aCap !== bCap) return aCap - bCap;
      const aFour = wouldHitFourConsec(a) ? 1 : 0;
      const bFour = wouldHitFourConsec(b) ? 1 : 0;
      if(aFour !== bFour) return aFour - bFour;
      const aOver = workCount[a.id] >= personTarget(a) ? 1 : 0;
      const bOver = workCount[b.id] >= personTarget(b) ? 1 : 0;
      if(aOver !== bOver) return aOver - bOver;
      if(consec[a.id] !== consec[b.id]) return consec[a.id] - consec[b.id];
      if(workCount[a.id] !== workCount[b.id]) return workCount[a.id] - workCount[b.id];
      return runRand[a.id] - runRand[b.id]; // 同順位はランダム
    }
    // 日勤の偏り平坦化: 5連勤になる人を後回し→4連勤になる人を後回し→目標未達の人を優先→連勤が短い人を優先→日勤回数が少ない人を優先
    function dayPriority(a,b){
      const aCap = wouldHitConsecCap(a) ? 1 : 0;
      const bCap = wouldHitConsecCap(b) ? 1 : 0;
      if(aCap !== bCap) return aCap - bCap;
      const aFour = wouldHitFourConsec(a) ? 1 : 0;
      const bFour = wouldHitFourConsec(b) ? 1 : 0;
      if(aFour !== bFour) return aFour - bFour;
      const aOver = workCount[a.id] >= personTarget(a) ? 1 : 0;
      const bOver = workCount[b.id] >= personTarget(b) ? 1 : 0;
      if(aOver !== bOver) return aOver - bOver;
      if(consec[a.id] !== consec[b.id]) return consec[a.id] - consec[b.id];
      if(dayCount[a.id] !== dayCount[b.id]) return dayCount[a.id] - dayCount[b.id];
      return workPriority(a,b); // 以降はworkCount→ランダム(cap/fourConsec/overTarget/consecは既に一致済み)
    }
    // 「夜勤傾向」(多め/普通/少なめ)を係数に変換する。多めの人は係数が大きいほど
    // 「夜勤回数÷係数」が小さく計算され、まだ少ない人として優先的に夜勤に回される。
    // 少なめの人は逆に係数を小さくして後回しにされやすくする。
    function nightWeight(mem){
      if(mem.nightTendency === 'more') return 1.6;
      if(mem.nightTendency === 'less') return 0.5;
      return 1;
    }
    // 夜勤の偏り平坦化: 夜勤専従を最優先し、次に「夜勤傾向で重み付けした夜勤回数」が少ない人を優先
    // (同じ重み付け回数なら総勤務の優先順位)。夜勤専従はnightOnlyMaxで別管理のため重み付けの対象外。
    function nightPriority(a,b){
      const aNO = a.nightOnly ? 0 : 1;
      const bNO = b.nightOnly ? 0 : 1;
      if(aNO !== bNO) return aNO - bNO;
      const aCap = wouldHitConsecCap(a) ? 1 : 0;
      const bCap = wouldHitConsecCap(b) ? 1 : 0;
      if(aCap !== bCap) return aCap - bCap;
      // 夜勤研修中で、月の目標回数(nightTrainingTarget)のペースにまだ届いていない人は、
      // 独り立ちに向けてなるべく夜勤に組み込めるよう優先する。
      const aTrain = (a.nightTraining && nightCount[a.id] < curNightTrainingPacedTarget) ? 0 : 1;
      const bTrain = (b.nightTraining && nightCount[b.id] < curNightTrainingPacedTarget) ? 0 : 1;
      if(aTrain !== bTrain) return aTrain - bTrain;
      const aAdj = a.nightOnly ? nightCount[a.id] : nightCount[a.id] / nightWeight(a);
      const bAdj = b.nightOnly ? nightCount[b.id] : nightCount[b.id] / nightWeight(b);
      if(aAdj !== bAdj) return aAdj - bAdj;
      return workPriority(a,b);
    }

    const weekdayCountUpTo = new Array(days + 1).fill(0);
    for(let dd = 1; dd <= days; dd++) weekdayCountUpTo[dd] = weekdayCountUpTo[dd-1] + (isWeekend(y,m,dd) ? 0 : 1);
    const totalWeekdays = weekdayCountUpTo[days];

    // 週(土日明けで区切ったブロック)ごとの通し番号。パート・育短の「何連勤で休みたくなるか」を
    // 週替わりでずらす際に使う(常に同じ2人が重なるのを避け、重なる組み合わせ自体を回す)。
    const weekBlockIndex = new Array(days + 1).fill(0);
    {
      let blockIdx = 0, prevWasWeekend = true;
      for(let dd = 1; dd <= days; dd++){
        const we = isWeekend(y,m,dd);
        if(!we && prevWasWeekend) blockIdx++;
        weekBlockIndex[dd] = blockIdx;
        prevWasWeekend = we;
      }
    }
    // 5連勤上限(MAX_CONSEC)の一歩手前で全員が同時に強制休みになる問題への対策。
    // パート・育短メンバーごとに「自主的に休みたくなる連勤数」を2〜(MAX_CONSEC-1)の範囲でずらして割り当てる。
    // ずらす相手の組み合わせ自体も週ブロックごとにローテーションし、特定の2人だけが常に重なるのを防ぐ。
    // (5連勤自体は絶対に発生させたくないため、この上限を超えて働かせ直すことはしない)
    const consecCapOptions = [];
    for(let c = MAX_CONSEC - 1; c >= 2; c--) consecCapOptions.push(c);
    function computeConsecCaps(group, weekIdx){
      const caps = {};
      if(group.length <= 1) return caps;
      group.forEach((mem, idx) => {
        const rotated = (idx + weekIdx) % group.length;
        caps[mem.id] = consecCapOptions[rotated % consecCapOptions.length];
      });
      return caps;
    }

    function runMonth(){
    initState();
    for(let d=1; d<=days; d++){
      let assignedToday = new Set();
      // 同点(回数が並んだ人)の並び順を「日ごとに」ランダムに振り直す。
      // これで月初の全員0など同点続きでも、毎日同じ順(メンバー一覧の上から)で埋まらず散る。
      // 平坦化の主キーは回数(dayCount/nightCount/workCount)なので、均等性は崩れない。
      members.forEach(mem => { runRand[mem.id] = Math.random(); });

      members.forEach(mem => {
        const key = getKey(y,m,d,mem.id);
        if(locked[key]){
          assignments[key] = locked[key];
          assignedToday.add(mem.id);
          const st = shiftTypes.find(s => s.id === locked[key]);
          if(st && !st.isOff) workCount[mem.id]++;
        }
      });

      const weekend = isWeekend(y,m,d);
      // 「日曜固定休み」フラグの人は、本人の希望より優先して日曜日を必ず休みにする(ロックより下・希望より上)
      if(new Date(y,m,d).getDay() === 0){
        members.forEach(mem => {
          if(!assignedToday.has(mem.id) && mem.sundayOff){
            assignments[getKey(y,m,d,mem.id)] = offType.id;
            assignedToday.add(mem.id);
          }
        });
      }
      // 平坦化のペース基準: 「最終的な目標まで埋める」のではなく「月の進み具合に応じた“今あるべき勤務数”」を補充の上限にする。
      // これで勤務が月の前半に左詰めされず、休みも月全体に均等に散る。最終日にはpace≒personTarget(mem)となり最終的な勤務数は確保される。
      // (d-1)を使うのがポイント: 初日は基準=0なので穴埋めが発火せず、「初日に全員が出勤(誰も休まない日)」を防ぐ。
      // 有給・リフレッシュ休暇を持つ人は目標勤務日数(personTarget)自体が少ないため、ペースもその人の分だけ低くなる。
      const pacedTarget = (mem) => personTarget(mem) * (d-1) / days;
      // 夜勤専従は常に最優先で埋まるため、ペース(月の経過に応じた按分)を掛けないと
      // 月の前半で上限(nightOnlyMax)まで使い切ってしまい、後半がまるごと休みになって重なりやすくなる。
      // 希望(wish)による割り当てはこの按分の対象外(本人の希望は尊重する)。
      const nightOnlyPacedCap = days > 0 ? nightOnlyMax * (d-1) / days : 0;
      // 夜勤研修中の人も同様に、月の経過に応じた按分をnightPriority側で参照する。
      curNightTrainingPacedTarget = days > 0 ? nightTrainingTarget * (d-1) / days : 0;

      // 全メンバーの勤務希望を最優先で確定する。
      // NG（絶対出勤不可）とロック済み（夜勤明け等）はこれより上位なのでスキップ。
      // これ以降の全プール（available等）は !assignedToday でフィルタされるため、
      // 希望を持つメンバーが後続ロジックで上書きされることはない。
      //
      // ただし「夜勤」の希望だけはここで即決しない。夜勤NGペア回避・副主任の重複回避・
      // 夜勤リーダー1名確保といった夜勤特有の調整は、後段の各夜勤ブロック(介護福祉士/
      // 看護師プール)の希望者優先ロジックにのみ実装されている。ここで無条件に確定させると
      // それらのチェックを素通りしてしまい、NGペア同士が同時に夜勤へ入ったり、必要人数(3名)
      // を超えて割り当てられたりする。師長の管理当直希望は必要人数のカウント外でこうした
      // 調整の対象外のため、従来通りここで確定する。
      members.forEach(mem => {
        if(assignedToday.has(mem.id)) return;
        if(isNG(mem,d)) return;
        const w = wish(mem,d);
        if(!w) return;
        const wt = shiftTypes.find(s=>s.id===w);
        if(!wt) return;
        if(w === nightType?.id && mem.role !== 'chief') return; // 夜勤ブロックに委ねる
        if(w === nightType?.id && mem.nightOnly && nightOnlyCount[mem.id] >= nightOnlyMax) return;
        if(mem.nightOnly && !wt.isOff && w !== nightType?.id) return; // 夜勤専従は日勤等の希望を無視
        if(justHadAke(mem,d) && !wt.isOff){
          // 明けの翌日は、日勤等の勤務希望があっても休みをデフォルトにする(人員不足時の例外は
          // 「明け→夜勤」のみで、日勤等には設けない)。夜勤を増やすと該当者が増えやすい。
          assignments[getKey(y,m,d,mem.id)] = offType.id;
          assignedToday.add(mem.id);
          lastWarnings.push(`${m+1}/${d}: ${mem.name} の${wt.name}希望を、夜勤明けの翌日のため休みに変更`);
          return;
        }
        // 連続勤務の絶対上限(新人・パート/育短・介護福祉士は4日、それ以外は5日)は、
        // 本人の希望であっても超えさせない。希望通りにすると上限を超える日は休みに変更する。
        const hardCap = (mem.role === 'care' || (mem.role === 'nurse' && (mem.newbie || mem.parttime || mem.ikuji))) ? MAX_CONSEC - 1 : MAX_CONSEC;
        if(!wt.isOff && consec[mem.id] >= hardCap){
          assignments[getKey(y,m,d,mem.id)] = offType.id;
          assignedToday.add(mem.id);
          lastWarnings.push(`${m+1}/${d}: ${mem.name} の${wt.name}希望を、連続勤務が上限(${hardCap}日)を超えるため休みに変更`);
          return;
        }
        assignments[getKey(y,m,d,mem.id)] = w;
        assignedToday.add(mem.id);
        if(!wt.isOff) workCount[mem.id]++;
      });

      if(chief && !assignedToday.has(chief.id)){
        // 「夜勤以外」希望は具体的なシフト指定ではないため、通常の希望なしと同じデフォルト
        // (平日は日勤、土日は休み)にフォールバックさせる(管理当直だけを避ける)。
        const chiefW = wish(chief,d);
        const chiefSpecificWish = (chiefW && chiefW !== AVOID_NIGHT_WISH) ? chiefW : null;
        if(isNG(chief,d)){
          assignments[getKey(y,m,d,chief.id)] = offType.id;
        } else if(justHadAke(chief,d)){
          // 明けの翌日は師長も他のスタッフと同様、休みをデフォルトにする
          assignments[getKey(y,m,d,chief.id)] = offType.id;
        } else if(weekend){
          assignments[getKey(y,m,d,chief.id)] = chiefSpecificWish || offType.id;
        } else {
          assignments[getKey(y,m,d,chief.id)] = chiefSpecificWish || dayType.id;
        }
        assignedToday.add(chief.id);
        {
          const chiefSt = shiftTypes.find(s => s.id === assignments[getKey(y,m,d,chief.id)]);
          if(chiefSt && !chiefSt.isOff) workCount[chief.id]++;
        }
      }
      // 病棟クラークも師長と同じ考え方で、希望が無ければ平日は日勤・土日祝は休みを既定にする。
      // 必要人数のカウント対象ではないため、日勤・夜勤の必要人数調整ロジックには一切関与しない。
      clerkMembers.forEach(mem => {
        if(assignedToday.has(mem.id)) return;
        const clerkW = wish(mem,d);
        const clerkSpecificWish = (clerkW && clerkW !== AVOID_NIGHT_WISH) ? clerkW : null;
        const key = getKey(y,m,d,mem.id);
        if(isNG(mem,d)){
          assignments[key] = offType.id;
        } else if(justHadAke(mem,d)){
          assignments[key] = offType.id;
        } else if(weekend){
          assignments[key] = clerkSpecificWish || offType.id;
        } else {
          assignments[key] = clerkSpecificWish || dayType.id;
        }
        assignedToday.add(mem.id);
        const clerkSt = shiftTypes.find(s => s.id === assignments[key]);
        if(clerkSt && !clerkSt.isOff) workCount[mem.id]++;
      });
      const chiefIsDayToday = chief && assignments[getKey(y,m,d,chief.id)] === dayType.id;

      ['day','night'].forEach(stKey => {
        const st = shiftTypes.find(s => s.id === stKey);
        if(!st) return;
        const req = careRequired[stKey] || 0;
        const stSort = (stKey === 'night') ? nightPriority : dayPriority; // 種別の回数が少ない人を優先して偏りを平坦化
        let filled = 0;
        members.forEach(mem => { if(mem.role==='care' && assignments[getKey(y,m,d,mem.id)] === st.id) filled++; });

        let available = careStaff.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d) && (stKey === 'night' ? canStartNight(mem) : canWorkDay(mem)) && (stKey !== 'night' || (canNight(mem) && (!mem.nightOnly || (nightOnlyCount[mem.id] < nightOnlyMax && (wish(mem,d) === nightType.id || nightOnlyCount[mem.id] < nightOnlyPacedCap))))) && (stKey !== 'day' || (!mem.nightOnly && !justHadAke(mem,d))));
        // 夜勤NGペアの片方をこのループ内で先に夜勤へ割り当てると、もう片方の衝突有無が変わる。
        // wishers/candidatesは事前に一括フィルタした配列なので、割り当て直前にもう一度
        // hasNightPairConflictを再判定しないと、同じループの中で両者が夜勤に入ってしまう。
        let wishers = available.filter(mem => wish(mem,d) === st.id);
        wishers.sort(stSort);
        for(const mem of wishers){
          if(filled >= req) break;
          if(assignedToday.has(mem.id)) continue;
          if(stKey === 'night' && hasNightPairConflict(mem,d)) continue;
          assignments[getKey(y,m,d,mem.id)] = st.id;
          assignedToday.add(mem.id);
          if(!st.isOff) workCount[mem.id]++;
          filled++;
        }
        if(filled < req){
          let candidates = available.filter(mem => !assignedToday.has(mem.id) && !conflictsWithWish(mem,d,st.id));
          candidates.sort(stSort);
          for(const mem of candidates){
            if(filled >= req) break;
            if(assignedToday.has(mem.id)) continue;
            if(stKey === 'night' && hasNightPairConflict(mem,d)) continue;
            assignments[getKey(y,m,d,mem.id)] = st.id;
            assignedToday.add(mem.id);
            if(!st.isOff) workCount[mem.id]++;
            filled++;
          }
        }
        if(filled < req){
          let candidates = available.filter(mem => !assignedToday.has(mem.id));
          candidates.sort(stSort);
          for(const mem of candidates){
            if(filled >= req) break;
            if(assignedToday.has(mem.id)) continue;
            if(stKey === 'night' && hasNightPairConflict(mem,d)) lastWarnings.push(`${m+1}/${d}: ${mem.name} を夜勤NGペアの相手と同時配置（介護福祉士の夜勤人員不足のため）`);
            assignments[getKey(y,m,d,mem.id)] = st.id;
            assignedToday.add(mem.id);
            if(!st.isOff) workCount[mem.id]++;
            filled++;
          }
        }
        if(filled < req){
          lastWarnings.push(`${m+1}/${d}: 介護福祉士の${st.name}が${filled}/${req}人`);
        }
      });
      // まず希望(休み/日勤)を反映
      careStaff.forEach(mem => {
        if(assignedToday.has(mem.id)) return;
        if(mem.nightOnly) return; // 夜勤専従は夜勤系ロジックまたは後段で処理
        const w = wish(mem,d);
        if(w){
          const wt = shiftTypes.find(s=>s.id===w);
          if(wt && wt.id !== 'night' && (wt.isOff || canWork(mem))){
            assignments[getKey(y,m,d,mem.id)] = wt.id;
            assignedToday.add(mem.id);
            if(!wt.isOff) workCount[mem.id]++;
          }
        }
      });
      // 介護福祉士も目標勤務日数(=当月日数-休日数)に届くまで日勤に追加し、休みが多くなりすぎないようにする。
      // 必要人数はあくまで最低人数なので、土日も含めてこれを超えて追加してよい。
      // 勤務日数が少ない人を優先。4連勤はなるべく作りたくないため、このペース追加では3連勤までに留める
      // (4連勤自体は介護福祉士の本来の上限として他ロジックでは許容するが、余裕のある追加では避ける)。
      const careFillers = careStaff.filter(mem =>
        !assignedToday.has(mem.id) &&
        canWork(mem) && consec[mem.id] < MAX_CONSEC-2 && !isNG(mem,d) && workCount[mem.id] < pacedTarget(mem) &&
        !mem.nightOnly && !justHadAke(mem,d)
      );
      careFillers.sort((a,b)=> (consec[a.id]-consec[b.id]) || (dayCount[a.id]-dayCount[b.id]) || (workCount[a.id]-workCount[b.id]) || (runRand[a.id]-runRand[b.id]));
      careFillers.forEach(mem => {
        assignments[getKey(y,m,d,mem.id)] = dayType.id;
        assignedToday.add(mem.id);
        workCount[mem.id]++;
      });
      // 残りは休み
      careStaff.forEach(mem => {
        if(assignedToday.has(mem.id)) return;
        assignments[getKey(y,m,d,mem.id)] = offType.id;
        assignedToday.add(mem.id);
      });

      {
        const req = nightType.required || 0;
        let filled = 0;
        let nleaderFilled = 0;
        members.forEach(mem => {
          if(inNursePool(mem) && assignments[getKey(y,m,d,mem.id)] === nightType.id){
            filled++;
            if(mem.nightLeader) nleaderFilled++;
          }
        });

        // 夜勤専従の按分上限(nightOnlyPacedCap)は、本人が「夜勤」を明示的に希望している場合は
        // 適用しない(本人の希望は尊重する。介護福祉士の夜勤枠でも同様の扱い)。上限(nightOnlyMax)
        // 自体は希望であっても超えない。
        let available = countableNurses.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d) && canStartNight(mem) && canNight(mem) && (!mem.nightOnly || (nightOnlyCount[mem.id] < nightOnlyMax && (wish(mem,d) === nightType.id || nightOnlyCount[mem.id] < nightOnlyPacedCap))));

        const nightSort = (a,b) => {
          const aLead = a.nightLeader?0:1, bLead = b.nightLeader?0:1;
          if(nleaderFilled === 0 && aLead !== bLead) return aLead - bLead;
          return nightPriority(a,b);
        };

        // 夜勤リーダーも「1人だけ」先に確保し、残り夜勤枠は夜勤回数の少ない人から均等に埋める。
        if(req > 0 && nleaderFilled === 0){
          const noConflict = mem => !conflictsWithWish(mem,d,nightType.id) && !hasNightPairConflict(mem,d) && !hasSubchiefNightConflict(mem,d);
          let ld = available.filter(mem => mem.nightLeader && noConflict(mem));
          if(ld.length === 0) ld = available.filter(mem => mem.nightLeader);
          ld.sort(nightPriority);
          if(ld.length){
            const mem = ld[0];
            assignments[getKey(y,m,d,mem.id)] = nightType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            nleaderFilled++;
          }
        }

        // 夜勤NGペア・副主任同士の重複は、ループの途中でどちらか一方が夜勤に決まった時点で
        // もう一方の衝突有無が変わる。wishers/candidatesは事前に一括フィルタした配列なので、
        // 割り当て直前にhasNightPairConflict/hasSubchiefNightConflictを再判定しないと、
        // 同じループの中で両者とも夜勤に入ってしまう。
        let wishers = available.filter(mem => !assignedToday.has(mem.id) && wish(mem,d) === nightType.id);
        wishers.sort(nightSort);
        for(const mem of wishers){
          if(filled >= req && nleaderFilled > 0) break;
          if(filled >= req && !mem.nightLeader) break;
          if(assignedToday.has(mem.id)) continue;
          if(hasNightPairConflict(mem,d) || hasSubchiefNightConflict(mem,d)) continue;
          assignments[getKey(y,m,d,mem.id)] = nightType.id;
          assignedToday.add(mem.id);
          workCount[mem.id]++;
          filled++;
          if(mem.nightLeader) nleaderFilled++;
        }
        if(filled < req || nleaderFilled === 0){
          let candidates = available.filter(mem => !assignedToday.has(mem.id) && !conflictsWithWish(mem,d,nightType.id));
          candidates.sort(nightSort);
          for(const mem of candidates){
            if(filled >= req && nleaderFilled > 0) break;
            if(filled >= req && !mem.nightLeader) break;
            if(assignedToday.has(mem.id)) continue;
            if(hasNightPairConflict(mem,d) || hasSubchiefNightConflict(mem,d)) continue;
            const w = wish(mem,d); const wt = w && shiftTypes.find(s=>s.id===w);
            if(w === AVOID_NIGHT_WISH) lastWarnings.push(`${m+1}/${d}: ${mem.name} の「夜勤以外」希望を上書きして夜勤に配置（夜勤人員不足のため）`);
            else if(wt && wt.isOff) lastWarnings.push(`${m+1}/${d}: ${mem.name} の休み希望を上書きして夜勤に配置（夜勤人員不足のため）`);
            assignments[getKey(y,m,d,mem.id)] = nightType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            if(mem.nightLeader) nleaderFilled++;
          }
        }
        if(filled < req || nleaderFilled === 0){
          let candidates = available.filter(mem => !assignedToday.has(mem.id));
          candidates.sort(nightSort);
          for(const mem of candidates){
            if(filled >= req && nleaderFilled > 0) break;
            if(filled >= req && !mem.nightLeader) break;
            const w = wish(mem,d); const wt = w && shiftTypes.find(s=>s.id===w);
            if(w === AVOID_NIGHT_WISH) lastWarnings.push(`${m+1}/${d}: ${mem.name} の「夜勤以外」希望を上書きして夜勤に配置（夜勤人員不足のため）`);
            else if(wt && wt.isOff) lastWarnings.push(`${m+1}/${d}: ${mem.name} の休み希望を上書きして夜勤に配置（夜勤人員不足のため）`);
            if(hasNightPairConflict(mem,d)) lastWarnings.push(`${m+1}/${d}: ${mem.name} を夜勤NGペアの相手と同時配置（夜勤人員不足のため）`);
            if(hasSubchiefNightConflict(mem,d)) lastWarnings.push(`${m+1}/${d}: ${mem.name} が他の副主任と同じ夜勤に重複配置（夜勤人員不足のため）`);
            assignments[getKey(y,m,d,mem.id)] = nightType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            if(mem.nightLeader) nleaderFilled++;
          }
        }
        if(filled < req){
          lastWarnings.push(`${m+1}/${d}: 夜勤看護師が${filled}/${req}人`);
        }
        if(req > 0 && nleaderFilled === 0){
          lastWarnings.push(`${m+1}/${d}: 夜勤リーダー可の看護師が夜勤に不在`);
        }

        // 夜勤研修中の人が今夜の夜勤に入っている場合、独り立ちしていない分の付き添いとして
        // もう1名(研修中でない人)を基本の必要人数(req)に上乗せして確保する。
        const trainingOnDuty = countableNurses.filter(mem =>
          mem.nightTraining && assignments[getKey(y,m,d,mem.id)] === nightType.id
        );
        if(trainingOnDuty.length > 0 && filled < req + 1){
          let topUp = countableNurses.filter(mem =>
            !assignedToday.has(mem.id) && !mem.nightTraining && !isNG(mem,d) &&
            canStartNight(mem) && canNight(mem) &&
            (!mem.nightOnly || (nightOnlyCount[mem.id] < nightOnlyMax && (wish(mem,d) === nightType.id || nightOnlyCount[mem.id] < nightOnlyPacedCap))) &&
            !conflictsWithWish(mem,d,nightType.id) && !hasNightPairConflict(mem,d) && !hasSubchiefNightConflict(mem,d)
          );
          if(topUp.length === 0){
            // 衝突回避を諦めても人数だけは最終手段として確保する
            topUp = countableNurses.filter(mem =>
              !assignedToday.has(mem.id) && !mem.nightTraining && !isNG(mem,d) &&
              canStartNight(mem) && canNight(mem) &&
              (!mem.nightOnly || (nightOnlyCount[mem.id] < nightOnlyMax && (wish(mem,d) === nightType.id || nightOnlyCount[mem.id] < nightOnlyPacedCap)))
            );
          }
          topUp.sort(nightPriority);
          if(topUp.length > 0){
            const mem = topUp[0];
            assignments[getKey(y,m,d,mem.id)] = nightType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            if(mem.nightLeader) nleaderFilled++;
          } else {
            lastWarnings.push(`${m+1}/${d}: 夜勤研修中の${trainingOnDuty.map(x=>x.name).join('・')}に付く夜勤看護師をもう1名確保できず`);
          }
        }
      }

      {
        const req = weekend ? weekendDayReq : (dayType.required || 0);
        let filled = 0;
        let leaderFilled = 0;
        members.forEach(mem => {
          if(inNursePool(mem) && assignments[getKey(y,m,d,mem.id)] === dayType.id && !mem.newbie && !mem.parttime && !mem.ikuji){
            filled++;
            if(mem.leader) leaderFilled++;
          }
        });

        let available = countableNurses.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d) && canWork(mem) && !mem.nightOnly && !justHadAke(mem,d));

        // 日勤リーダーは「1人だけ」先に確保する(リーダー全員を先頭に寄せない)。
        // こうしないとリーダーが毎日まず全員日勤に取られ、上の行ばかり勤務=「上から埋まる」見た目になる。
        // 1人確保すれば、残り枠は日勤回数の少ない人からリーダー・非リーダー区別なく均等に埋まる。
        if(req > 0 && leaderFilled === 0){
          const noConflict = mem => !conflictsWithWish(mem,d,dayType.id);
          let ld = available.filter(mem => mem.leader && noConflict(mem));
          if(ld.length === 0) ld = available.filter(mem => mem.leader); // 希望と衝突してでも最低1人は確保
          ld.sort(dayPriority);
          if(ld.length){
            const mem = ld[0];
            assignments[getKey(y,m,d,mem.id)] = dayType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            leaderFilled++;
          }
        }

        let wishers = available.filter(mem => !assignedToday.has(mem.id) && wish(mem,d) === dayType.id);
        wishers.sort((a,b) => {
          const aLead = a.leader?0:1, bLead = b.leader?0:1;
          if(leaderFilled === 0 && aLead !== bLead) return aLead - bLead;
          return dayPriority(a,b);
        });
        for(const mem of wishers){
          if(filled >= req) break;
          assignments[getKey(y,m,d,mem.id)] = dayType.id;
          assignedToday.add(mem.id);
          workCount[mem.id]++;
          filled++;
          if(mem.leader) leaderFilled++;
        }

        if(filled < req || leaderFilled === 0){
          let candidates = available.filter(mem => !assignedToday.has(mem.id) && !conflictsWithWish(mem,d,dayType.id));
          candidates.sort((a,b) => {
            const aLead = a.leader?0:1, bLead = b.leader?0:1;
            if(leaderFilled === 0 && aLead !== bLead) return aLead - bLead;
            return dayPriority(a,b);
          });
          for(const mem of candidates){
            if(filled >= req && leaderFilled > 0) break;
            if(filled >= req && !mem.leader) break;
            assignments[getKey(y,m,d,mem.id)] = dayType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            if(mem.leader) leaderFilled++;
