      const card = document.createElement('div');
      card.style.cssText = `background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:10px 12px; margin-bottom:10px;`;
      const h = document.createElement('p');
      h.style.cssText = `font-weight:500; font-size:13px; margin:0 0 ${descText ? '2px' : '8px'};`;

        const d = document.createElement('p');
        d.style.cssText = `font-size:11px; color:var(--color-text-secondary); margin:0 0 8px;`;
        d.textContent = descText;
        card.appendChild(d);
      }
      modalContent.appendChild(card);
      return card;
    }
    // ラベル(左)と入力欄(右)を揃えた1行を作る共通部品。カード内で複数並べても

    closeBtn.style.cssText = `width:100%;`;
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', closeModal);
    modalContent.appendChild(closeBtn);
  }

  async function exportExcel(){
    if(!hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
      autoAssign();
    }
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const days = daysInMonth(y,m);
    const weekdayNames = ['日','月','火','水','木','金','土'];

    // Excel出力(シフト表)専用の表記。日々のシフト欄はここで指定した記号を使い、それ以外の
    // シフト種別(午前休・午後休・フリー等)は通常のシフト名のまま出力する。
    const EXCEL_SHIFT_SYMBOL = { day: '・', night: '△', ake: '-', off: '×', training: '研', paid: '有' };
    function excelShiftLabel(stId){
      const st = shiftTypes.find(s => s.id === stId);
      if(!st) return '';
      return EXCEL_SHIFT_SYMBOL[stId] !== undefined ? EXCEL_SHIFT_SYMBOL[stId] : st.name;
    }

    // シフト表の右側に集計列(勤務日数・シフト種別ごとの回数)を並べ、シートを1枚にまとめる
    // (画面の割り振り結果と同じ考え方)。
    const summaryHeaders = ['勤務日数', ...shiftTypes.map(st=>st.name)];

    const sheet1Data = [];
    const dateHeader = ['職員'];
    const weekdayHeader = [''];
    for(let d=1; d<=days; d++){
      const wd = new Date(y,m,d).getDay();
      dateHeader.push(d);
      weekdayHeader.push(weekdayNames[wd]);
    }
    dateHeader.push(...summaryHeaders);
    weekdayHeader.push(...summaryHeaders.map(()=>''));
    sheet1Data.push(dateHeader);
    sheet1Data.push(weekdayHeader);
    members.forEach(mem => {
      const row = [`${mem.name}(${ROLE_LABELS[mem.role]})`];
      let workDays = 0;
      const counts = {};
      shiftTypes.forEach(st => counts[st.id] = 0);
      for(let d=1; d<=days; d++){
        const stId = assignments[getKey(y,m,d,mem.id)];
        row.push(excelShiftLabel(stId));
        if(stId){
          counts[stId] = (counts[stId]||0) + 1;
          const st = shiftTypes.find(s => s.id === stId);
          if(st && !st.isOff) workDays++;
        }
      }
      row.push(workDays, ...shiftTypes.map(st => counts[st.id]||0));
      sheet1Data.push(row);
    });

    const wb = new ExcelJS.Workbook();
    const ws1 = wb.addWorksheet('シフト表');
    // 印刷時に横向き・1ページに収まるよう設定(SheetJS無料版はこの設定を書き出せないため、
    // ページ設定に対応しているExcelJSに切り替えている)。
    ws1.pageSetup.orientation = 'landscape';
    ws1.pageSetup.fitToPage = true;
    ws1.pageSetup.fitToWidth = 1;
    ws1.pageSetup.fitToHeight = 1;
    // scale(拡大縮小印刷)がpageSetupに残っているとExcelがfitToWidth/fitToHeightより
    // scaleを優先してしまい、「1ページに収める」が反映されないことがあるため明示的に外す。
    delete ws1.pageSetup.scale;
    // horizontalDpi/verticalDpiの既定値(未設定を表す4294967295)がそのまま出力されると、
    // Excel側がページ設定全体を不正とみなして無視し、結局「1ページに収める」が効かなくなる
    // (実機のMicrosoft Excelで検証して確認済み)。正常な値を明示しておく。
    ws1.pageSetup.horizontalDpi = 600;
    ws1.pageSetup.verticalDpi = 600;
    sheet1Data.forEach(row => ws1.addRow(row));

    // ファイル名に出力日時を含める。同名ファイルが増えると誤って古い版を開いてしまう
    // (ブラウザが「(1)」等を付けて別ファイルとして保存するため)ことがあるので、それを防ぐ。
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const fname = `勤務表_${y}年${m+1}月_${stamp}.xlsx`;

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    // Claudeのartifactとして公開している場合、通常のaタグ経由のダウンロードはサンドボックスで
    // 無効化されるため、downloads機能(window.claude.use('downloads'))経由で保存する。
    // このHTMLファイルを直接ブラウザで開いている場合はwindow.claudeが存在しないため、
    // 従来通りのaタグ経由のダウンロードにフォールバックする。
    let savedViaCapability = false;
    if(window.claude && typeof window.claude.use === 'function'){
      try {
        const downloads = await window.claude.use('downloads');
        if(downloads){
          await downloads.save({ filename: fname, data: blob });
          savedViaCapability = true;
        }
      } catch(e) {
        if(e && e.code === 'declined') return; // ユーザーが保存をキャンセルした場合は何もしない
        savedViaCapability = false; // それ以外のエラーはフォールバックを試みる
      }
    }
    if(!savedViaCapability){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }

  function switchTab(tab){
    activeTab = tab;
    disarmClearAllWishes(); // タブを切り替えたら「全部クリア」の確認中表示は解除しておく
    disarmClearAllManual();
    const tabInput = document.getElementById('tabInput');
    const tabResult = document.getElementById('tabResult');
    if(tab === 'input'){
      inputView.style.display = '';
      resultView.style.display = 'none';
      tabInput.classList.add('active');
      tabResult.classList.remove('active');
    } else {
      inputView.style.display = 'none';
      resultView.style.display = '';
      tabInput.classList.remove('active');
      tabResult.classList.add('active');
      if(!hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
        autoAssign();
      } else {
        renderResultGrid();
        renderSummary();
        renderWarnings();
      }
    }
  }

  document.getElementById('tabInput').addEventListener('click', () => switchTab('input'));
  document.getElementById('tabResult').addEventListener('click', () => switchTab('result'));

  // 「月を変更」で別の月に切り替えても、その月の割り振り結果は消さない(前月末の勤務を
  // 翌月の月初判定に使うため)。切り替え先の月がまだ未生成なら自動割り振り、
  // 既に生成・編集済みならそのまま表示する。
  function refreshForCurrentMonth(){
    monthLabel.textContent = `${currentDate.getFullYear()}年 ${currentDate.getMonth()+1}月`;
    if(activeTab === 'input'){
      renderInputGrid();
    } else if(!hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){
      autoAssign();
    } else {
      renderResultGrid();
      renderSummary();
      renderWarnings();
    }
  }
  // アプリを開いた直後だけ「何月の勤務表を作るか」を選ぶ画面を挟む。その後の月移動は
  // 従来どおり「‹ ›」ボタンで直接切り替える(月を変更するたびに毎回この画面には戻らない)。
  // ブラウザによって<input type="month">の見た目・操作感がバラバラ(自由入力に見えてしまう
  // 環境もある)なため、年・月それぞれをプルダウンで選ぶ方式にしている。
  function showMonthSetupView(){
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    monthSetupYear.innerHTML = '';
    for(let yy = y - 2; yy <= y + 2; yy++){
      const opt = document.createElement('option');
      opt.value = String(yy);
      opt.textContent = `${yy}年`;
      if(yy === y) opt.selected = true;
      monthSetupYear.appendChild(opt);
    }
    monthSetupMonth.innerHTML = '';
    for(let mm = 1; mm <= 12; mm++){
      const opt = document.createElement('option');
      opt.value = String(mm);
      opt.textContent = `${mm}月`;
      if(mm === m+1) opt.selected = true;
      monthSetupMonth.appendChild(opt);
    }
    appEl.style.display = 'none';
    monthSetupView.style.display = '';
  }
  document.getElementById('monthSetupConfirmBtn').addEventListener('click', () => {
    const yy = parseInt(monthSetupYear.value, 10);
    const mm = parseInt(monthSetupMonth.value, 10);
    if(yy && mm){ currentDate = new Date(yy, mm-1, 1); }
    disarmClearAllWishes(); // 月を変えると確認中の件数表示が古くなるため、確認状態は解除する
    disarmClearAllManual();
    monthSetupView.style.display = 'none';
    appEl.style.display = '';
    refreshForCurrentMonth();
    saveToStorage();
  });
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    disarmClearAllWishes(); // 月をまたぐと確認中の件数表示が古くなるため、確認状態は解除する
    disarmClearAllManual();
    refreshForCurrentMonth();
    saveToStorage();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    disarmClearAllWishes();
    disarmClearAllManual();
    refreshForCurrentMonth();
    saveToStorage();
  });
  document.getElementById('manageRulesBtn').addEventListener('click', openRulesModal);
  document.getElementById('manageMembersBtn').addEventListener('click', () => openMembersModal());
  document.getElementById('manageShiftsBtn').addEventListener('click', openShiftsModal);
  document.getElementById('autoAssignBtn').addEventListener('click', () => {
    const btn = document.getElementById('autoAssignBtn');
    const originalText = btn.textContent;
    btn.textContent = '生成中…';
    btn.disabled = true;
    setTimeout(() => {
      autoAssignBest(8);
      switchTab('result');
      btn.textContent = originalText;
      btn.disabled = false;
    }, 10); // ボタンの表示更新を先に描画させてから重い処理に入る
  });
  document.getElementById('exportBtn').addEventListener('click', exportExcel);

  // 「この月の希望をすべてクリア」: 表示中の月・全メンバー分の希望をまとめて削除する重い操作なので、
  // メンバー削除ボタンと同じく1回目のクリックでは確認表示に切り替えるだけにし、その状態でもう一度
  // クリックしたときだけ実行する(一定時間操作がなければ元に戻す)。業務調整(manualEdit/assignments)
  // には触れず、あくまで本人の希望(preferences)だけを対象にする。
  const clearAllWishesBtn = document.getElementById('clearAllWishesBtn');
  let clearAllArmed = false;
  let clearAllTimer = null;
  function disarmClearAllWishes(){
    clearAllArmed = false;
    if(clearAllTimer){ clearTimeout(clearAllTimer); clearAllTimer = null; }
    clearAllWishesBtn.textContent = 'この月の希望をすべてクリア';
    clearAllWishesBtn.style.borderColor = '';
    clearAllWishesBtn.style.color = '';
  }
  clearAllWishesBtn.addEventListener('click', () => {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const targetKeys = Object.keys(preferences).filter(k => isKeyInMonth(k,y,m));
    if(targetKeys.length === 0) return; // この月にはまだ希望が無い
    if(!clearAllArmed){
      clearAllArmed = true;
      clearAllWishesBtn.textContent = `本当に${targetKeys.length}件を全部クリア?`;
      clearAllWishesBtn.style.borderColor = cv('c-red',600);
      clearAllWishesBtn.style.color = cv('c-red',600);
      clearAllTimer = setTimeout(disarmClearAllWishes, 3000);
      return;
    }
    disarmClearAllWishes();
    targetKeys.forEach(k => delete preferences[k]);
    renderInputGrid();
    if(hasDataForMonth(y,m)){
      autoAssign();
      renderResultGrid(); renderSummary(); renderWarnings();
    }
    saveToStorage();
  });

  // 師長が業務調整として確定した分(manualEdit)をこの月だけまとめて解除するボタン。
  // manualEditフラグを外すだけで良い: 次のautoAssign()内のclearMonthData()が
  // 「manualEditが立っていないセルの割り振りは削除して良い」と判断するので、
  // 解除したセルは自動的に空き枠に戻り、通常の自動割り振り対象になる。
  const clearAllManualBtn = document.getElementById('clearAllManualBtn');
  let clearAllManualArmed = false;
  let clearAllManualTimer = null;
  function disarmClearAllManual(){
    clearAllManualArmed = false;
    if(clearAllManualTimer){ clearTimeout(clearAllManualTimer); clearAllManualTimer = null; }
    clearAllManualBtn.textContent = 'この月の勤務調整をすべてクリア';
    clearAllManualBtn.style.borderColor = '';
    clearAllManualBtn.style.color = '';
  }
  clearAllManualBtn.addEventListener('click', () => {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const targetKeys = Object.keys(manualEdit).filter(k => isKeyInMonth(k,y,m));
    if(targetKeys.length === 0) return; // この月にはまだ確定(業務調整)が無い
    if(!clearAllManualArmed){
      clearAllManualArmed = true;
      clearAllManualBtn.textContent = `本当に${targetKeys.length}件を全部クリア?`;
      clearAllManualBtn.style.borderColor = cv('c-purple',600);
      clearAllManualBtn.style.color = cv('c-purple',600);
      clearAllManualTimer = setTimeout(disarmClearAllManual, 3000);
      return;
    }
    disarmClearAllManual();
    targetKeys.forEach(k => delete manualEdit[k]);
    renderInputGrid();
    if(hasDataForMonth(y,m)){
      autoAssign();
      renderResultGrid(); renderSummary(); renderWarnings();
    }
    saveToStorage();
  });

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeModal();
  });

  loadFromStorage();
  renderLegend();
  renderRoleFilter();
  renderInputGrid();
  if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){ renderResultGrid(); renderSummary(); renderWarnings(); }
  monthLabel.textContent = `${currentDate.getFullYear()}年 ${currentDate.getMonth()+1}月`;
  setSyncStatus(syncStatus);
  pullFromCloud();
  // ツールを開いたら最初に「何月の勤務表を作るか」を選ぶ画面を挟む(前回開いていた月を初期値にする)。
  showMonthSetupView();
})();
</script>
</body>
