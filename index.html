            if(filled >= req && leaderFilled > 0) break;
          }
        }

        if(filled < req || leaderFilled === 0){
          let candidates = available.filter(mem => !assignedToday.has(mem.id));
          candidates.sort((a,b) => {
            const aLead = a.leader?0:1, bLead = b.leader?0:1;
            if(leaderFilled === 0 && aLead !== bLead) return aLead - bLead;
            return dayPriority(a,b);
          });
          for(const mem of candidates){
            if(filled >= req && leaderFilled > 0) break;
            if(filled >= req && !mem.leader) break;
            const w = wish(mem,d); const wt = w && shiftTypes.find(s=>s.id===w);
            if(wt && wt.isOff) lastWarnings.push(`${m+1}/${d}: ${mem.name} の休み希望を上書きして日勤に配置（日勤人員不足のため）`);
            // 「夜勤以外」希望の人は日勤への割り当ては希望どおりなので警告不要
            assignments[getKey(y,m,d,mem.id)] = dayType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            filled++;
            if(mem.leader) leaderFilled++;
            if(filled >= req && leaderFilled > 0) break;
          }
        }

        if(filled < req){
          lastWarnings.push(`${m+1}/${d}: 日勤看護師が${filled}/${req}人`);
        }
        if(req > 0 && leaderFilled === 0){
          lastWarnings.push(`${m+1}/${d}: 日勤リーダー可の看護師が日勤に不在`);
        }
      }

      // 新人同士の休みが毎回重ならないよう調整する。
      // 全員同じペース計算で休みを決めると新人全員が同じ日に休みがちになるため、
      // 休みが重なった日は「今回休みのままにする人」を順番にローテーションし、まんべんなくズラす。
      const newbieDecisions = pickStaggeredOff(newbieMembers, newbieRotate,
        mem => !(canWork(mem) && consec[mem.id] < MAX_CONSEC-1 && workCount[mem.id] < pacedTarget(mem) + (newbiePhaseOffset[mem.id]||0)), d, assignedToday);
      if(newbieDecisions){
        newbieDecisions.forEach(({mem, wantsOff}) => {
          assignments[getKey(y,m,d,mem.id)] = wantsOff ? offType.id : dayType.id;
          assignedToday.add(mem.id);
          if(!wantsOff) workCount[mem.id]++;
        });
      }

      // パート・育短同士の勤務・休みが毎回重ならないよう調整する(新人と同じく土日も勤務対象。同じ考え方でローテーション)。
      {
        // 全員共通のMAX_CONSEC-1ではなく、メンバーごとにずらした上限(2〜4連勤)を使う(重なる相手も週替わりでローテーション)。
        const limitedConsecCaps = computeConsecCaps(weekdayLimitedMembers, weekBlockIndex[d] - 1);
        const limitedCapFn = mem => limitedConsecCaps[mem.id] || (MAX_CONSEC - 1);
        // 新人と同じ考え方のpacedTarget(土日込み・有給/リフレッシュ休暇分は差し引き済み)を使う。
        const limitedDecisions = pickStaggeredOff(weekdayLimitedMembers, limitedRotate,
          mem => !(canWork(mem) && consec[mem.id] < limitedCapFn(mem) && workCount[mem.id] < pacedTarget(mem) + (limitedPhaseOffset[mem.id]||0)), d, assignedToday, limitedCapFn);
        if(limitedDecisions){
          limitedDecisions.forEach(({mem, wantsOff}) => {
            assignments[getKey(y,m,d,mem.id)] = wantsOff ? offType.id : dayType.id;
            assignedToday.add(mem.id);
            if(!wantsOff) workCount[mem.id]++;
          });
        }
      }

      limitedNurses.forEach(mem => {
        if(assignedToday.has(mem.id)) return;
        if(mem.nightOnly) return; // 夜勤専従は夜勤系ロジックまたは後段で処理
        if(isNG(mem,d)){
          assignments[getKey(y,m,d,mem.id)] = offType.id;
          assignedToday.add(mem.id);
          return;
        }
        const w = wish(mem,d);
        if(w === dayType.id || (w && shiftTypes.find(s=>s.id===w) && shiftTypes.find(s=>s.id===w).isOff)){
          // 新人・パート・育短は希望があっても4連勤を超えたら休みにする(5連勤にしない)
          const limitedBlocked = consec[mem.id] >= MAX_CONSEC-1;
          if(w === dayType.id && (!canWork(mem) || limitedBlocked)){
            assignments[getKey(y,m,d,mem.id)] = offType.id;
            assignedToday.add(mem.id);
            return;
          }
          assignments[getKey(y,m,d,mem.id)] = w;
          assignedToday.add(mem.id);
          if(w === dayType.id) workCount[mem.id]++;
          return;
        }
        // 新人・パート・育短ともに土日も勤務対象。4連勤超は自動で休みにする。
        const limWork = canWork(mem) && consec[mem.id] < MAX_CONSEC-1 && workCount[mem.id] < pacedTarget(mem);
        assignments[getKey(y,m,d,mem.id)] = limWork ? dayType.id : offType.id;
        assignedToday.add(mem.id);
        if(limWork) workCount[mem.id]++;
      });

      {
        let subDayCount = 0;
        subchiefs.forEach(mem => { if(assignments[getKey(y,m,d,mem.id)] === dayType.id) subDayCount++; });

        let available = subchiefs.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d) && !mem.nightOnly);
        available.forEach(mem => {
          if(assignedToday.has(mem.id)) return;
          const w = wish(mem,d);
          // 「夜勤以外」希望は特定のシフトを指定するものではないため、ここでは確定させず後段のロジックに委ねる。
          // 「夜勤」希望もここでは確定させない: 副主任同士の重複回避(hasSubchiefNightConflict)・
          // 夜勤NGペア回避は上の夜勤ブロックでのみ判定される。ここで無条件に確定すると、その夜勤ブロックで
          // 衝突を理由に見送られた副主任の夜勤希望がノーチェックのまま復活してしまい、副主任2名が
          // 同時に夜勤入りする事態になる。夜勤ブロックで叶わなかった夜勤希望は、この日は日勤/休みの
          // 残余ロジックに委ねる。
          if(w && w !== AVOID_NIGHT_WISH && w !== nightType?.id){
            assignments[getKey(y,m,d,mem.id)] = w;
            assignedToday.add(mem.id);
            if(!shiftTypes.find(s=>s.id===w).isOff) workCount[mem.id]++;
            if(w === dayType.id) subDayCount++;
          }
        });

        const needSubDay = !chiefIsDayToday;
        if(needSubDay && subDayCount === 0){
          let candidates = subchiefs.filter(mem => !assignedToday.has(mem.id) && !isNG(mem,d) && canWork(mem) && !mem.nightOnly && !justHadAke(mem,d));
          if(candidates.length === 0 && !weekend){
            // NG(希望不可)は最終手段として上書きしてよいが、明けの翌日を出勤にする例外は設けない
            candidates = subchiefs.filter(mem => !assignedToday.has(mem.id) && canWork(mem) && !mem.nightOnly && !justHadAke(mem,d));
          }
          candidates.sort(dayPriority);
          if(candidates.length > 0){
            const mem = candidates[0];
            assignments[getKey(y,m,d,mem.id)] = dayType.id;
            assignedToday.add(mem.id);
            workCount[mem.id]++;
            subDayCount++;
          } else if(!weekend){
            lastWarnings.push(`${m+1}/${d}: 師長不在のため副主任の日勤配置が必要だが調整できず`);
          }
        }

        subchiefs.forEach(mem => {
          if(assignedToday.has(mem.id)) return;
          if(mem.nightOnly) return; // 夜勤専従は日勤に割り当てない(後段で休みになる)
          // 必要人数はあくまで最低人数なので、目標勤務日数に届いていなければ土日も追加してよい。
          // ただし4連勤はなるべく作りたくないため、このペース追加では3連勤までに留める。
          const subWork = canWork(mem) && consec[mem.id] < MAX_CONSEC-2 && workCount[mem.id] < pacedTarget(mem) && !justHadAke(mem,d);
          assignments[getKey(y,m,d,mem.id)] = subWork ? dayType.id : offType.id;
          assignedToday.add(mem.id);
          if(subWork) workCount[mem.id]++;
        });
      }

      if(nightType){
        members.forEach(mem => {
          if(assignments[getKey(y,m,d,mem.id)] === nightType.id){
            if(d+1 <= days && akeType){
              locked[getKey(y,m,d+1,mem.id)] = akeType.id;
            }
            // 翌々日(明けの翌日)は強制的に休みにはしない。
            // デフォルトは休みだが、人員不足なら「明け→夜勤」で再び夜勤候補に入れる(justHadAke参照)。
          }
        });
      }

      // この日まだ割り当てが無い人の処理:
      // 常勤の看護師プールは休日数の目標に届くまで日勤を追加し、休みすぎを防ぐ。それ以外は休み。
      // 日勤の必要人数(dayType.required・weekendDayReq)はあくまで最低人数であり、
      // 目標勤務日数に届いていない人がいれば、土日もこの最低人数を超えて追加してよい。
      // 勤務日数が少ない人を優先して追加し、日勤帯の偏りを抑える。
      // 4連勤はなるべく作りたくないため、この余裕分の追加では3連勤までに留める
      // (必要人数を満たすためにどうしても4連勤(・5連勤)が必要な場合は、上のdayPriorityの
      // 優先順位付けにより後回しにされつつも最終手段として選ばれる)。
      const fillers = members.filter(mem =>
        !assignments[getKey(y,m,d,mem.id)] &&
        inNursePool(mem) && !mem.newbie && !mem.parttime && !mem.ikuji && !mem.nightOnly && !justHadAke(mem,d) &&
        canWork(mem) && consec[mem.id] < MAX_CONSEC-2 && !isNG(mem,d) && workCount[mem.id] < pacedTarget(mem) &&
        !(wish(mem,d) && shiftTypes.find(s=>s.id===wish(mem,d))?.isOff)
      );
      fillers.sort((a,b)=> (consec[a.id]-consec[b.id]) || (dayCount[a.id]-dayCount[b.id]) || (workCount[a.id]-workCount[b.id]) || (runRand[a.id]-runRand[b.id]));
      // 平坦化: この日の常勤(新人・短時間除く)日勤人数が上限に達したら、穴埋めを打ち切る。
      // 上限は月平均から算出(パス2のみ)。パス1や土日は Infinity = 従来どおり無制限。
      const dayCap = dayCapFn ? dayCapFn(d) : Infinity;
      let curCountableDay = 0;
      members.forEach(mem => { if(countableSet.has(mem.id) && assignments[getKey(y,m,d,mem.id)] === dayType.id) curCountableDay++; });
      fillers.forEach(mem => {
        if(curCountableDay >= dayCap) return; // 上限到達: 以降は休みのまま(翌平日に優先補充される)
        if(wish(mem,d) === nightType.id) lastWarnings.push(`${m+1}/${d}: ${mem.name} の夜勤希望が叶わず日勤に配置（${nightWishOverrideReason(d)}）`);
        assignments[getKey(y,m,d,mem.id)] = dayType.id;
        workCount[mem.id]++;
        curCountableDay++; // fillersは常勤看護師なのでカウント対象
      });

      // 谷の底上げ: 上限キャップ後もこの日の常勤日勤が下限(平日平均)に満たなければ、
      // ペース(pacedTarget)を無視して追加し、薄い日を埋める。
      // ただし月間目標勤務日数(targetWork)は絶対に超えない=働きすぎ・月末枯渇を防ぐ。
      // これも4連勤はなるべく作りたくないため、3連勤までに留める(必要人数自体は上のブロックで
      // 別途確保済みのため、ここで人数を絞っても最低人数を割ることはない)。
      const dayFloor = dayFloorFn ? dayFloorFn(d) : 0;
      if(curCountableDay < dayFloor){
        const floorFillers = members.filter(mem =>
          !assignments[getKey(y,m,d,mem.id)] &&
          inNursePool(mem) && !mem.newbie && !mem.parttime && !mem.ikuji && !mem.nightOnly && !justHadAke(mem,d) &&
          !weekend && canWork(mem) && consec[mem.id] < MAX_CONSEC-2 && !isNG(mem,d) &&
          workCount[mem.id] < personTarget(mem) &&
          !(wish(mem,d) && shiftTypes.find(s=>s.id===wish(mem,d))?.isOff)
        );
        floorFillers.sort((a,b)=> (consec[a.id]-consec[b.id]) || (dayCount[a.id]-dayCount[b.id]) || (workCount[a.id]-workCount[b.id]) || (runRand[a.id]-runRand[b.id]));
        floorFillers.forEach(mem => {
          if(curCountableDay >= dayFloor) return; // 下限に達したら打ち切り
          if(wish(mem,d) === nightType.id) lastWarnings.push(`${m+1}/${d}: ${mem.name} の夜勤希望が叶わず日勤に配置（${nightWishOverrideReason(d)}）`);
          assignments[getKey(y,m,d,mem.id)] = dayType.id;
          workCount[mem.id]++;
          curCountableDay++;
        });
      }
      members.forEach(mem => {
        const key = getKey(y,m,d,mem.id);
        if(!assignments[key]) assignments[key] = offType.id;
      });

      // 連続勤務日数を更新(明けも勤務に数える。休みでリセット)。5連勤に達した人は警告
      // あわせて日勤・夜勤の累計回数を集計し、翌日以降の割り当てで「回数が少ない人」を優先して偏りを平坦化する。
      members.forEach(mem => {
        const aId = assignments[getKey(y,m,d,mem.id)];
        if(aId === 'day') dayCount[mem.id]++;
        else if(aId === 'night'){
          nightCount[mem.id]++;
          if(mem.nightOnly){
            // 月末(当月最終日)の夜勤入りは翌月に明けが続く=1回分の負荷が翌月にもまたがるため、
            // ここでは0.5回分だけをこの月のカウントに加える(残り0.5は翌月initState側で加算)。
            nightOnlyCount[mem.id] += (d === days) ? 0.5 : 1;
          }
        }
        const st = shiftTypes.find(s => s.id === aId);
        if(st && !st.isOff){
          consec[mem.id]++;
          // 直前日が夜勤で当日が明けの場合は、夜勤1回分の一連の流れであり
          // 「日勤を5日連続で詰め込んだ」のとは事情が違うため、この警告からは除外する。
          const prevWasNightIntoAke = aId === akeType?.id && d > 1 && assignments[getKey(y,m,d-1,mem.id)] === nightType?.id;
          if(consec[mem.id] >= MAX_CONSEC && !prevWasNightIntoAke){
            lastWarnings.push(`${m+1}/${d}: ${mem.name} が${consec[mem.id]}連勤(極力回避)`);
          }
        } else {
          consec[mem.id] = 0;
        }
      });
    }
    }

    // パス1: 上限なしで生成し、平日の常勤日勤人数の月平均を測定する
    runMonth();
    let twTotal = 0, twDays = 0;
    for(let d=1; d<=days; d++){
      if(isWeekend(y,m,d)) continue;
      let c = 0;
      members.forEach(mem => { if(countableSet.has(mem.id) && assignments[getKey(y,m,d,mem.id)] === dayType.id) c++; });
      twTotal += c; twDays++;
    }
    const baseTarget = twDays ? twTotal / twDays : 0;
    const reqDay = (dayType && dayType.required) || 0;
    const loCap = Math.max(reqDay, Math.round(baseTarget)); // 火・木など通常平日の上限
    const hiCap = loCap + 2;                                // 月・水・金は+2人まで許容(実際は需要に応じ+1〜+2に収まる)
    dayCapFn = (dd) => {
      const wd = new Date(y, m, dd).getDay();
      if(wd === 0 || wd === 6) return Infinity;             // 土日はweekendDayReq側で制御・上限なし
      return (wd === 1 || wd === 3 || wd === 5) ? hiCap : loCap;
    };
    dayFloorFn = (dd) => {
      const wd = new Date(y, m, dd).getDay();
      if(wd === 0 || wd === 6) return 0;                    // 土日は底上げ対象外
      return loCap;                                          // 平日は最低でも平均人数を目指す
    };

    // パス2: 上限つきで本生成(平日の常勤日勤人数を平坦化)
    runMonth();

    // パス3: 休みの日数は「目標」ではなく「確定値」。人数に余裕があって目標勤務日数(targetWork)に
    // 届いていない人がいれば、休みの日を日勤に変換してでも必ず届かせる(必要人数はあくまで最低人数のため、
    // ここでは超えて配置してよい)。対象は常勤の看護師・副主任(新人・パート/育短・夜勤専従は対象外)。
    // consec配列は生成過程でのみ正しい値を持つため、後付け判定にはassignmentsから実際の連勤数を数え直す。
    function consecRunIfWorking(mem, d){
      let count = 1;
      let dd = d - 1, yy = y, mm = m;
      while(true){
        if(dd < 1){ mm--; if(mm < 0){ mm = 11; yy--; } dd = daysInMonth(yy,mm); }
        const st = shiftTypes.find(s => s.id === assignments[getKey(yy,mm,dd,mem.id)]);
        if(st && !st.isOff){ count++; dd--; } else break;
        if(count > MAX_CONSEC + 2) break; // 安全弁(無限ループ防止)
      }
      let dd2 = d + 1, yy2 = y, mm2 = m;
      while(true){
        if(dd2 > daysInMonth(yy2,mm2)){ dd2 = 1; mm2++; if(mm2 > 11){ mm2 = 0; yy2++; } }
        const st = shiftTypes.find(s => s.id === assignments[getKey(yy2,mm2,dd2,mem.id)]);
        if(st && !st.isOff){ count++; dd2++; } else break;
        if(count > MAX_CONSEC + 2) break;
      }
      return count;
    }
    // 必要人数(最低人数)を埋める際、その日にたまたま目標未達の人が誰もいないと、
    // 既に目標に達した人を仕方なく追加してしまい、目標勤務日数を超過することがある。
    // その超過分を、必要人数を割らない範囲で日勤から外して目標ちょうどまで戻す。
    function trimOverTargets(){
      const eligible = countableNurses.filter(mem => !mem.nightOnly);
      eligible.sort((a,b) => workCount[b.id] - workCount[a.id]); // 超過が大きい人から優先して減らす
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] > personTarget(mem) && guard < days){
          guard++;
          const workDays = [];
          let best = null, bestSlack = -1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== dayType.id) continue; // 日勤の日だけを対象にする
            if(locked[key]) continue; // 夜勤明け等のロックは変更しない
            workDays.push(d);
            const weekendDay = isWeekend(y,m,d);
            const req = weekendDay ? weekendDayReq : (dayType.required || 0);
            let c = 0, leaderCount = 0;
            members.forEach(other => {
              if(countableSet.has(other.id) && assignments[getKey(y,m,d,other.id)] === dayType.id){
                c++;
                if(other.leader) leaderCount++;
              }
            });
            if(c - 1 < req) continue; // 外すと必要人数を割る
            if(mem.leader && leaderCount <= 1) continue; // 外すとリーダー不在になる
            const slack = c - req;
            if(slack > bestSlack){ bestSlack = slack; best = d; } // 最も余裕がある日から優先的に外す
          }
          if(best !== null){
            assignments[getKey(y,m,best,mem.id)] = offType.id;
            workCount[mem.id]--;
            continue;
          }
          // 単純に外せる日が無い(勤務日が全て必要人数ギリギリ)場合、
          // その日にまだ目標未達の人がいれば「交代」する(このmemを休みに、代わりにその人を日勤に)。
          let swapped = false;
          for(const d of workDays){
            const key = getKey(y,m,d,mem.id);
            let leaderCountWithoutMem = 0;
            members.forEach(other => {
              if(other.id !== mem.id && countableSet.has(other.id) && assignments[getKey(y,m,d,other.id)] === dayType.id && other.leader) leaderCountWithoutMem++;
            });
            let candidates = countableNurses.filter(other =>
              other.id !== mem.id && !other.nightOnly &&
              assignments[getKey(y,m,d,other.id)] === offType.id &&
              !locked[getKey(y,m,d,other.id)] &&
              !isNG(other,d) &&
              !justHadAke(other,d) &&
              !conflictsWithWish(other,d,dayType.id) &&
              workCount[other.id] < personTarget(other) &&
              consecRunIfWorking(other, d) <= MAX_CONSEC
            );
            if(mem.leader && leaderCountWithoutMem === 0){
              candidates = candidates.filter(c => c.leader); // 外すとリーダー不在になるなら交代相手もリーダー限定
            }
            if(candidates.length === 0) continue;
            candidates.sort((a,b) => workCount[a.id] - workCount[b.id]); // 一番不足している人を優先して交代
            const repl = candidates[0];
            assignments[key] = offType.id;
            workCount[mem.id]--;
            assignments[getKey(y,m,d,repl.id)] = dayType.id;
            workCount[repl.id]++;
            swapped = true;
            break;
          }
          if(!swapped){
            // 日勤側で調整できない場合、夜勤(+翌日の明け)が原因で超過している可能性がある。
            // 必要人数・夜勤リーダーを割らない範囲で、夜勤+明けのペアごと外す。
            let nightBest = null, nightBestSlack = -1;
            for(let d = 1; d <= days; d++){
              const key = getKey(y,m,d,mem.id);
              if(assignments[key] !== nightType.id) continue;
              if(locked[key]) continue;
              let c = 0, leaderCount = 0;
              members.forEach(other => {
                if(inNursePool(other) && assignments[getKey(y,m,d,other.id)] === nightType.id){
                  c++;
                  if(other.nightLeader) leaderCount++;
                }
              });
              // その日に(本人以外の)夜勤研修中の人がいる場合、必要人数は付き添い分+1になる
              const hasOtherTrainee = countableNurses.some(other =>
                other.id !== mem.id && other.nightTraining && assignments[getKey(y,m,d,other.id)] === nightType.id
              );
              const req = (nightType.required || 0) + (hasOtherTrainee ? 1 : 0);
              if(c - 1 < req) continue; // 外すと必要人数(付き添い分含む)を割る
              if(mem.nightLeader && leaderCount <= 1) continue; // 外すと夜勤リーダー不在になる
              const slack = c - req;
              if(slack > nightBestSlack){ nightBestSlack = slack; nightBest = d; }
            }
            if(nightBest !== null){
              assignments[getKey(y,m,nightBest,mem.id)] = offType.id;
              workCount[mem.id]--;
              if(nightBest + 1 <= days){
                const akeKey = getKey(y,m,nightBest+1,mem.id);
                if(assignments[akeKey] === akeType?.id){
                  delete locked[akeKey];
                  assignments[akeKey] = offType.id;
                  workCount[mem.id]--; // 明けの分も勤務日数から減る
                }
              }
              swapped = true;
            }
          }
          if(!swapped) break; // これ以上どうしようもない(交代相手もいない)
        }
      });
    }
    function backfillOffTargets(){
      const eligible = countableNurses.filter(mem => !mem.nightOnly);
      eligible.sort((a,b) => workCount[a.id] - workCount[b.id]); // 不足が大きい人から優先して埋める
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] < personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = Infinity;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== offType.id) continue; // 休みの日だけを対象にする
            if(isNG(mem,d)) continue; // NGは尊重
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; } // 休み希望は尊重
            if(locked[key]) continue; // 夜勤明け等のロックは変更しない
            if(justHadAke(mem,d)) continue; // 明けの翌日は日勤に戻さない(休みがデフォルト)
            if(mem.sundayOff && new Date(y,m,d).getDay() === 0) continue; // 日曜固定休みの日は動かさない
            if(consecRunIfWorking(mem, d) > MAX_CONSEC) continue; // 5連勤(真の上限)を超えるのは不可
            let c = 0;
            members.forEach(other => { if(countableSet.has(other.id) && assignments[getKey(y,m,d,other.id)] === dayType.id) c++; });
            if(c < bestCount){ bestCount = c; best = d; } // 最も人数が薄い日から優先的に埋める
          }
          if(best === null) break; // これ以上安全に埋められる日がない(NG・希望休で埋まっている等)
          assignments[getKey(y,m,best,mem.id)] = dayType.id;
          workCount[mem.id]++;
        }
      });
    }
    trimOverTargets();
    backfillOffTargets();

    // その日の日勤に実際に入っている人数(看護師の必要人数対象者・パート/育短・新人・介護福祉士の
    // 全員を含む「出勤スタッフ総数」)。以下のパート/育短・新人・介護福祉士の調整では、
    // 自分の職種内の人数だけでなく、この総数を見て「薄い日を優先的に埋め、厚い日から優先的に外す」
    // ことで、看護師の必要人数以外のスタッフも含めた1日あたりの出勤人数を平坦化する。
    function totalDayHeadcount(d){
      let c = 0;
      members.forEach(mem => { if(assignments[getKey(y,m,d,mem.id)] === dayType.id) c++; });
      return c;
    }

    // パート・育短も休みの日数は確定値。必要人数の対象外(countableSetに含まれない)なので
    // 人数不足のチェックは不要で、単純に超過を削り不足を埋めるだけでよい。
    // ただし5連勤にはしない方針のため、上限はMAX_CONSEC-1(4連勤)を使う。
    function trimOverTargetsLimited(){
      const eligible = weekdayLimitedMembers.slice();
      eligible.sort((a,b) => workCount[b.id] - workCount[a.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] > personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = -1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== dayType.id) continue;
            if(locked[key]) continue;
            const c = totalDayHeadcount(d);
            if(c > bestCount){ bestCount = c; best = d; } // 全体の出勤人数が一番多い日から優先的に外す
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = offType.id;
          workCount[mem.id]--;
        }
      });
    }
    function backfillOffTargetsLimited(){
      const eligible = weekdayLimitedMembers.slice();
      eligible.sort((a,b) => workCount[a.id] - workCount[b.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] < personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = Infinity;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== offType.id) continue;
            if(isNG(mem,d)) continue;
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; }
            if(locked[key]) continue;
            if(mem.sundayOff && new Date(y,m,d).getDay() === 0) continue; // 日曜固定休みの日は動かさない
            if(consecRunIfWorking(mem, d) > MAX_CONSEC - 1) continue; // パート・育短は4連勤まで
            const c = totalDayHeadcount(d);
            if(c < bestCount){ bestCount = c; best = d; } // 全体の出勤人数が一番薄い日から優先的に埋める
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = dayType.id;
          workCount[mem.id]++;
        }
      });
    }
    trimOverTargetsLimited();
    backfillOffTargetsLimited();

    // 新人も休みの日数は確定値。パート・育短と同じく必要人数の対象外(countableSetに含まれない)なので
    // 人数不足のチェックは不要で、単純に超過を削り不足を埋めるだけでよい(以前はこの補正が無く、
    // 日々のペース配分だけに頼っていたため、設定した休日数どおりにならないことがあった)。
    // ただし5連勤にはしない方針のため、上限はMAX_CONSEC-1(4連勤)を使う。
    function trimOverTargetsNewbie(){
      const eligible = newbieMembers.slice();
      eligible.sort((a,b) => workCount[b.id] - workCount[a.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] > personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = -1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== dayType.id) continue;
            if(locked[key]) continue;
            const c = totalDayHeadcount(d);
            if(c > bestCount){ bestCount = c; best = d; } // 全体の出勤人数が一番多い日から優先的に外す
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = offType.id;
          workCount[mem.id]--;
        }
      });
    }
    function backfillOffTargetsNewbie(){
      const eligible = newbieMembers.slice();
      eligible.sort((a,b) => workCount[a.id] - workCount[b.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] < personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = Infinity;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== offType.id) continue;
            if(isNG(mem,d)) continue;
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; }
            if(locked[key]) continue;
            if(mem.sundayOff && new Date(y,m,d).getDay() === 0) continue; // 日曜固定休みの日は動かさない
            if(consecRunIfWorking(mem, d) > MAX_CONSEC - 1) continue; // 新人は4連勤まで
            const c = totalDayHeadcount(d);
            if(c < bestCount){ bestCount = c; best = d; } // 全体の出勤人数が一番薄い日から優先的に埋める
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = dayType.id;
          workCount[mem.id]++;
        }
      });
    }
    trimOverTargetsNewbie();
    backfillOffTargetsNewbie();

    // 介護福祉士も休みの日数は確定値。必要人数(careRequired.day)を割らない範囲で超過を削り、
    // 4連勤(MAX_CONSEC-1)を超えない範囲で不足を埋める。
    function trimOverTargetsCare(){
      const careDayReqLocal = careRequired.day || 0;
      const eligible = careStaff.filter(mem => !mem.nightOnly);
      eligible.sort((a,b) => workCount[b.id] - workCount[a.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] > personTarget(mem) && guard < days){
          guard++;
          const workDays = [];
          let best = null, bestSlack = -1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== dayType.id) continue;
            if(locked[key]) continue;
            workDays.push(d);
            let careC = 0;
            careStaff.forEach(other => { if(assignments[getKey(y,m,d,other.id)] === dayType.id) careC++; });
            if(careC - 1 < careDayReqLocal) continue; // 外すと介護福祉士の必要人数を割る
            const slack = totalDayHeadcount(d); // 全体の出勤人数が一番多い日から優先的に外す
            if(slack > bestSlack){ bestSlack = slack; best = d; }
          }
          if(best !== null){
            assignments[getKey(y,m,best,mem.id)] = offType.id;
            workCount[mem.id]--;
            continue;
          }
          // 単純に外せる日が無ければ、目標未達の介護福祉士と交代する
          let swapped = false;
          for(const d of workDays){
            const key = getKey(y,m,d,mem.id);
            let candidates = careStaff.filter(other =>
              other.id !== mem.id && !other.nightOnly &&
              assignments[getKey(y,m,d,other.id)] === offType.id &&
              !locked[getKey(y,m,d,other.id)] &&
              !isNG(other,d) &&
              !justHadAke(other,d) &&
              !conflictsWithWish(other,d,dayType.id) &&
              workCount[other.id] < personTarget(other) &&
              consecRunIfWorking(other, d) <= MAX_CONSEC - 1
            );
            if(candidates.length === 0) continue;
            candidates.sort((a,b) => workCount[a.id] - workCount[b.id]);
            const repl = candidates[0];
            assignments[key] = offType.id;
            workCount[mem.id]--;
            assignments[getKey(y,m,d,repl.id)] = dayType.id;
            workCount[repl.id]++;
            swapped = true;
            break;
          }
          if(!swapped) break;
        }
      });
    }
    function backfillOffTargetsCare(){
      const eligible = careStaff.filter(mem => !mem.nightOnly);
      eligible.sort((a,b) => workCount[a.id] - workCount[b.id]);
      eligible.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] < personTarget(mem) && guard < days){
          guard++;
          let best = null, bestCount = Infinity;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            if(assignments[key] !== offType.id) continue;
            if(isNG(mem,d)) continue;
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; }
            if(locked[key]) continue;
            if(justHadAke(mem,d)) continue; // 明けの翌日は日勤に戻さない(休みがデフォルト)
            if(consecRunIfWorking(mem, d) > MAX_CONSEC - 1) continue; // 介護福祉士は4連勤まで
            const c = totalDayHeadcount(d);
            if(c < bestCount){ bestCount = c; best = d; } // 全体の出勤人数が一番薄い日から優先的に埋める
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = dayType.id;
          workCount[mem.id]++;
        }
      });
    }
    trimOverTargetsCare();
    backfillOffTargetsCare();

    // 師長も月の休日数は「シフト設定」の共通目標(monthlyOffTarget)に合わせる。
    // 「平日は基本日勤・土日は基本休み」という既定ロジックだけだと、実際の休日数は
    // その月の土日の数まかせになり、希望をどこに入れたか(特に土日に出勤系の希望を入れたか)
    // によって目標からずれてしまう。他のスタッフと同様に過不足を調整する。
    // 本人の明確な出勤・休み希望やNG、ロックされた日(明け等)は変更しない。
    // 休みに戻す日・出勤に戻す日を選ぶ際、単に見つかった順(月の早い日から)に決めてしまうと、
    // 調整分の休みが月初などに偏ってしまう。実際の連勤日数(consecRunIfWorking)をスコアにして、
    // 「今いちばん連勤が長くなっている箇所」を優先的に休みに戻す/避けるようにし、
    // 休みを月全体にバランス良く配置しつつ5連勤の発生自体を減らす。
    function trimOverTargetsChief(){
      if(!chief) return;
      let guard = 0;
      while(workCount[chief.id] > personTarget(chief) && guard < days){
        guard++;
        let best = null, bestScore = -1;
        for(let d = 1; d <= days; d++){
          const key = getKey(y,m,d,chief.id);
          const st = shiftTypes.find(s => s.id === assignments[key]);
          if(!st || st.isOff) continue; // 出勤している日だけが対象
          if(locked[key]) continue;
          const w = wish(chief,d);
          if(w && w !== AVOID_NIGHT_WISH){
            const wt = shiftTypes.find(s=>s.id===w);
            if(wt && !wt.isOff) continue; // 具体的な出勤希望がある日は本人の希望を尊重して外さない
          }
          // 連勤が長い箇所ほど優先して休みに戻す(5連勤の解消を優先)。同じ長さなら土日を優先。
          const runLen = consecRunIfWorking(chief, d);
          const weekendDay = isWeekend(y,m,d);
          const score = runLen * 10 + (weekendDay ? 1 : 0);
          if(score > bestScore){ bestScore = score; best = d; }
        }
        if(best === null) break;
        assignments[getKey(y,m,best,chief.id)] = offType.id;
        workCount[chief.id]--;
      }
    }
    function backfillOffTargetsChief(){
      if(!chief) return;
      let guard = 0;
      while(workCount[chief.id] < personTarget(chief) && guard < days){
        guard++;
        let best = null, bestScore = Infinity;
        for(let d = 1; d <= days; d++){
          const key = getKey(y,m,d,chief.id);
          const st = shiftTypes.find(s => s.id === assignments[key]);
          if(!st || !st.isOff) continue; // 休みの日だけが対象
          if(isNG(chief,d)) continue; // NGは尊重
          const w = wish(chief,d);
          if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; } // 休み希望は尊重
          if(locked[key]) continue;
          if(justHadAke(chief,d)) continue; // 明けの翌日は日勤に戻さない(休みがデフォルト)
          const runLen = consecRunIfWorking(chief, d);
          if(runLen > MAX_CONSEC) continue; // 5連勤を超える箇所には追加しない
          // 出勤に戻しても連勤が短く済む箇所を優先(長い連勤を新たに作らない)。同じ長さなら平日を優先。
          const weekday = !isWeekend(y,m,d);
          const score = runLen * 10 + (weekday ? 0 : 1);
          if(score < bestScore){ bestScore = score; best = d; }
        }
        if(best === null) break;
        assignments[getKey(y,m,best,chief.id)] = dayType.id;
        workCount[chief.id]++;
      }
    }
    trimOverTargetsChief();
    backfillOffTargetsChief();

    // 「平日基本日勤・土日基本休み」のままだと、月の休日数が目標ちょうど(通常は土日の数と
    // ほぼ同じ)でも、土日をまたいで月～金がまるごと出勤になる週が必ず出てしまい、5連勤を
    // 完全には避けられない。休日の総数は変えず、5連勤になっている週の平日1日を休みに回す代わりに
    // 別の週の土日を1日出勤にする「入れ替え」で、休日数を保ったまま5連勤の発生自体を減らす。
    function resolveChiefLongRunsBySwap(){
      if(!chief) return;
      let guard = 0;
      while(guard < days * 2){
        guard++;
        // 現時点でいちばん連勤が長くなっている(5日以上)、入れ替え可能な出勤日を探す
        let worstDay = null, worstRun = MAX_CONSEC - 1;
        for(let d = 1; d <= days; d++){
          const key = getKey(y,m,d,chief.id);
          const st = shiftTypes.find(s => s.id === assignments[key]);
          if(!st || st.isOff) continue;
          if(locked[key]) continue;
          const w = wish(chief,d);
          if(w && w !== AVOID_NIGHT_WISH){
            const wt = shiftTypes.find(s=>s.id===w);
            if(wt && !wt.isOff) continue; // 具体的な出勤希望がある日は動かさない
          }
          const runLen = consecRunIfWorking(chief, d);
          if(runLen > worstRun){ worstRun = runLen; worstDay = d; }
        }
        if(worstDay === null) break; // 5連勤以上の箇所はもう無い

        // 交換相手: 現在休みで、明確な休み希望が無く(既定の土日休み等)、出勤に変えても
        // 新たな5連勤を作らない日を選ぶ。土日を優先する(平日の休みはできるだけ残す)。
        let swapDay = null, swapScore = -1;
        for(let d = 1; d <= days; d++){
          if(d === worstDay) continue;
          const key = getKey(y,m,d,chief.id);
          const st = shiftTypes.find(s => s.id === assignments[key]);
          if(!st || !st.isOff) continue;
          if(isNG(chief,d)) continue;
          const w = wish(chief,d);
          if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; } // 明確な休み希望は尊重
          if(locked[key]) continue;
          const runLenIfWork = consecRunIfWorking(chief, d);
          if(runLenIfWork > MAX_CONSEC - 1) continue; // 交換した結果また5連勤になるのは避ける
          const weekendDay = isWeekend(y,m,d);
          const score = (weekendDay ? 100 : 0) + (MAX_CONSEC - 1 - runLenIfWork);
          if(score > swapScore){ swapScore = score; swapDay = d; }
        }
        if(swapDay === null) break; // 安全に交換できる相手が見つからない場合はここで諦める(休日数は崩さない)

        assignments[getKey(y,m,worstDay,chief.id)] = offType.id;
        assignments[getKey(y,m,swapDay,chief.id)] = dayType.id;
        // workCount合計は変わらない(出勤1減・出勤1増)ため更新不要
      }
    }
    resolveChiefLongRunsBySwap();

    // 上記の入れ替えより前に生成された「○連勤」警告は、入れ替え前の(まだ5連勤が残っていた)
    // 割り当てを前提にしているため古くなっている。師長分だけ一旦取り除き、最終的な割り当てを
    // もとに連勤日数を数え直して警告を作り直す。
    if(chief){
      lastWarnings = lastWarnings.filter(w => !(w.includes(`: ${chief.name} が`) && w.includes('連勤(極力回避)')));
      let run = 0;
      { // 前月末からの連勤の引き継ぎ(実データがあれば)を起点にする
        let c = 0, dd = prevDays, yy = prevY, mm = prevM;
        while(c < MAX_CONSEC + 2){
          const aId = assignments[getKey(yy,mm,dd,chief.id)];
          if(aId === undefined) break;
          const st = shiftTypes.find(s => s.id === aId);
          if(!st || st.isOff) break;
          c++; dd--;
          if(dd < 1){ mm--; if(mm < 0){ mm = 11; yy--; } dd = daysInMonth(yy,mm); }
        }
        run = c;
      }
      for(let d = 1; d <= days; d++){
        const key = getKey(y,m,d,chief.id);
        const aId = assignments[key];
        const st = shiftTypes.find(s => s.id === aId);
        if(st && !st.isOff){
          run++;
          const prevWasNightIntoAke = aId === akeType?.id && d > 1 && assignments[getKey(y,m,d-1,chief.id)] === nightType?.id;
          if(run >= MAX_CONSEC && !prevWasNightIntoAke){
            lastWarnings.push(`${m+1}/${d}: ${chief.name} が${run}連勤(極力回避)`);
          }
        } else {
          run = 0;
        }
      }
    }

    // 病棟クラークも師長と同じ考え方(平日基本日勤・土日基本休み)を使うため、目標休日数との
    // 過不足調整・5連勤解消も師長と同じロジックを適用する。複数人になりうるので配列でループする点のみ、
    // 単数の師長版とは異なる(処理内容そのものは同一)。
    function trimOverTargetsClerk(){
      clerkMembers.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] > personTarget(mem) && guard < days){
          guard++;
          let best = null, bestScore = -1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            const st = shiftTypes.find(s => s.id === assignments[key]);
            if(!st || st.isOff) continue;
            if(locked[key]) continue;
            const w = wish(mem,d);
            if(w && w !== AVOID_NIGHT_WISH){
              const wt = shiftTypes.find(s=>s.id===w);
              if(wt && !wt.isOff) continue;
            }
            const runLen = consecRunIfWorking(mem, d);
            const weekendDay = isWeekend(y,m,d);
            const score = runLen * 10 + (weekendDay ? 1 : 0);
            if(score > bestScore){ bestScore = score; best = d; }
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = offType.id;
          workCount[mem.id]--;
        }
      });
    }
    function backfillOffTargetsClerk(){
      clerkMembers.forEach(mem => {
        let guard = 0;
        while(workCount[mem.id] < personTarget(mem) && guard < days){
          guard++;
          let best = null, bestScore = Infinity;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            const st = shiftTypes.find(s => s.id === assignments[key]);
            if(!st || !st.isOff) continue;
            if(isNG(mem,d)) continue;
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; }
            if(locked[key]) continue;
            if(justHadAke(mem,d)) continue;
            const runLen = consecRunIfWorking(mem, d);
            if(runLen > MAX_CONSEC) continue;
            const weekday = !isWeekend(y,m,d);
            const score = runLen * 10 + (weekday ? 0 : 1);
            if(score < bestScore){ bestScore = score; best = d; }
          }
          if(best === null) break;
          assignments[getKey(y,m,best,mem.id)] = dayType.id;
          workCount[mem.id]++;
        }
      });
    }
    trimOverTargetsClerk();
    backfillOffTargetsClerk();

    // 「平日基本日勤・土日基本休み」のままだと、月～金がまるごと出勤の週が必ず出て5連勤に
    // なりうるため、師長と同じく休日数の合計は変えずに「入れ替え」で5連勤の発生自体を減らす。
    function resolveClerkLongRunsBySwap(){
      clerkMembers.forEach(mem => {
        let guard = 0;
        while(guard < days * 2){
          guard++;
          let worstDay = null, worstRun = MAX_CONSEC - 1;
          for(let d = 1; d <= days; d++){
            const key = getKey(y,m,d,mem.id);
            const st = shiftTypes.find(s => s.id === assignments[key]);
            if(!st || st.isOff) continue;
            if(locked[key]) continue;
            const w = wish(mem,d);
            if(w && w !== AVOID_NIGHT_WISH){
              const wt = shiftTypes.find(s=>s.id===w);
              if(wt && !wt.isOff) continue;
            }
            const runLen = consecRunIfWorking(mem, d);
            if(runLen > worstRun){ worstRun = runLen; worstDay = d; }
          }
          if(worstDay === null) break;

          let swapDay = null, swapScore = -1;
          for(let d = 1; d <= days; d++){
            if(d === worstDay) continue;
            const key = getKey(y,m,d,mem.id);
            const st = shiftTypes.find(s => s.id === assignments[key]);
            if(!st || !st.isOff) continue;
            if(isNG(mem,d)) continue;
            const w = wish(mem,d);
            if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && wt.isOff) continue; }
            if(locked[key]) continue;
            const runLenIfWork = consecRunIfWorking(mem, d);
            if(runLenIfWork > MAX_CONSEC - 1) continue;
            const weekendDay = isWeekend(y,m,d);
            const score = (weekendDay ? 100 : 0) + (MAX_CONSEC - 1 - runLenIfWork);
            if(score > swapScore){ swapScore = score; swapDay = d; }
          }
          if(swapDay === null) break;

          assignments[getKey(y,m,worstDay,mem.id)] = offType.id;
          assignments[getKey(y,m,swapDay,mem.id)] = dayType.id;
        }
      });
    }
    resolveClerkLongRunsBySwap();

    // 師長と同様、入れ替え前提の古い「○連勤」警告を除去し、最終的な割り当てをもとに数え直す。
    clerkMembers.forEach(mem => {
      lastWarnings = lastWarnings.filter(w => !(w.includes(`: ${mem.name} が`) && w.includes('連勤(極力回避)')));
      let run = 0;
      {
        let c = 0, dd = prevDays, yy = prevY, mm = prevM;
        while(c < MAX_CONSEC + 2){
          const aId = assignments[getKey(yy,mm,dd,mem.id)];
          if(aId === undefined) break;
          const st = shiftTypes.find(s => s.id === aId);
          if(!st || st.isOff) break;
          c++; dd--;
          if(dd < 1){ mm--; if(mm < 0){ mm = 11; yy--; } dd = daysInMonth(yy,mm); }
        }
        run = c;
      }
      for(let d = 1; d <= days; d++){
        const key = getKey(y,m,d,mem.id);
        const aId = assignments[key];
        const st = shiftTypes.find(s => s.id === aId);
        if(st && !st.isOff){
          run++;
          if(run >= MAX_CONSEC){
            lastWarnings.push(`${m+1}/${d}: ${mem.name} が${run}連勤(極力回避)`);
          }
        } else {
          run = 0;
        }
      }
    });

    // 夜勤専従は日勤に入らないため、休みの日数は月間の夜勤上限回数(nightOnlyMax)に応じて決まり、
    // シフト設定の目標休日数(monthlyOffTarget)を超えることが多い。この超過分は単なる「休み」ではなく
    // 「有給」を消化したものとして扱い、目標を超えた日数分だけ休みを有給に振り替える。
    function applyNightOnlyExcessOffToPaid(){
      members.filter(mem => mem.nightOnly).forEach(mem => {
        const offDays = [];
        for(let d = 1; d <= days; d++){
          if(assignments[getKey(y,m,d,mem.id)] === offType.id) offDays.push(d);
        }
        if(offDays.length <= monthlyOffTarget) return;
        offDays.slice(monthlyOffTarget).forEach(d => {
          assignments[getKey(y,m,d,mem.id)] = 'paid';
        });
      });
    }
    applyNightOnlyExcessOffToPaid();

    // 本人が希望したわけではない(自動生成された)3連休以上は、なるべく作らない。
    // 3日以上連続で休み(休み・有給・リフレッシュ休暇等のisOffシフト)になっている箇所のうち、
    // 全ての日が本人の明示的な休み系希望によるものでない場合、その中の1日(できるだけ真ん中に
    // 近い日)を出勤に変え、代わりに月内の別の出勤日(できれば土日)を休みに振り替える
    // (合計の勤務日数・目標達成状況は変えない=単なる日の入れ替え)。
    // 夜勤専従は夜勤の入り方自体で休みの塊ができる仕組みのため対象外。
    function wouldCreateLongOffRun(mem, dd){
      let len = 1;
      let i = dd - 1;
      while(i >= 1){
        const st = shiftTypes.find(s => s.id === assignments[getKey(y,m,i,mem.id)]);
        if(st && st.isOff){ len++; i--; } else break;
      }
      let j = dd + 1;
      while(j <= days){
        const st = shiftTypes.find(s => s.id === assignments[getKey(y,m,j,mem.id)]);
        if(st && st.isOff){ len++; j++; } else break;
      }
      return len >= 3;
    }
    function reduceUnwishedLongOffRuns(mem){
      let guard = 0;
      while(guard < days){
        guard++;
        // 月内(前後月をまたがない範囲)で3日以上連続の休みrunを探す
        let runStart = null, runLen = 0, targetRun = null;
        for(let d = 1; d <= days + 1; d++){
          const key = d <= days ? getKey(y,m,d,mem.id) : null;
          const st = key ? shiftTypes.find(s => s.id === assignments[key]) : null;
          const isOffDay = !!(st && st.isOff);
          if(isOffDay){
            if(runStart === null) runStart = d;
            runLen++;
          } else {
            if(runLen >= 3){
              const runDays = Array.from({length: runLen}, (_, i2) => runStart + i2);
              const hasUnwished = runDays.some(dd => {
                const k = getKey(y,m,dd,mem.id);
                if(locked[k]) return false; // ロック日は動かせないので判定対象外
                const w = wish(mem,dd);
                const wt = w && shiftTypes.find(s=>s.id===w);
                return !(wt && wt.isOff); // 明示的な休み系希望が無い日がある
              });
              if(hasUnwished){ targetRun = { start: runStart, len: runLen }; break; }
            }
            runStart = null; runLen = 0;
          }
        }
        if(!targetRun) break; // 崩すべき「希望ではない3連休」がもう無い

        // run内で「希望が無く・ロックもNGでもない」日から、runを分断する効果が高い(真ん中に近い)日を選ぶ
        const candidates = [];
        for(let dd = targetRun.start; dd < targetRun.start + targetRun.len; dd++){
          const k = getKey(y,m,dd,mem.id);
          if(locked[k]) continue;
          const w = wish(mem,dd);
          const wt = w && shiftTypes.find(s=>s.id===w);
          if(wt && wt.isOff) continue; // 明示的な休み希望の日は動かさない
          if(isNG(mem,dd)) continue; // NGの日は出勤にできない
          if(justHadAke(mem,dd)) continue; // 明けの翌日は休みを維持する
          if(mem.sundayOff && new Date(y,m,dd).getDay() === 0) continue; // 日曜固定休みの日は動かさない
          candidates.push(dd);
        }
        if(candidates.length === 0) break; // 崩せる日が無い(全て希望・ロック・NG・明け翌日)
        const mid = targetRun.start + (targetRun.len - 1) / 2;
        candidates.sort((a,b) => Math.abs(a - mid) - Math.abs(b - mid));
        const breakDay = candidates[0];

        // 交代相手(出勤→休みにする日)を探す。日勤の日のみが対象(夜勤等はここでは動かさない)。
        let swapDay = null, swapScore = -1;
        for(let dd = 1; dd <= days; dd++){
          if(dd === breakDay) continue;
          const k = getKey(y,m,dd,mem.id);
          if(assignments[k] !== dayType.id) continue; // 日勤の日だけを交代対象にする
          if(locked[k]) continue;
          if(isNG(mem,dd)) continue;
          const w = wish(mem,dd);
          if(w){ const wt = shiftTypes.find(s=>s.id===w); if(wt && !wt.isOff) continue; } // 具体的な出勤希望がある日は動かさない
          // 必要人数チェック: 必要人数の対象(常勤看護師・副主任)のみ。介護福祉士は別枠の必要人数、
          // 新人・パート/育短・師長は必要人数カウント外なのでチェック不要。
          if(countableSet.has(mem.id)){
            const weekendDay = isWeekend(y,m,dd);
            const req = weekendDay ? weekendDayReq : (dayType.required || 0);
            let c = 0, leaderCount = 0;
            members.forEach(other => {
              if(countableSet.has(other.id) && assignments[getKey(y,m,dd,other.id)] === dayType.id){
                c++;
                if(other.leader) leaderCount++;
              }
            });
            if(c - 1 < req) continue; // 外すと必要人数を割る
            if(mem.leader && leaderCount <= 1) continue; // 外すとリーダー不在になる
          } else if(mem.role === 'care'){
            const careDayReqLocal = careRequired.day || 0;
            let c = 0;
            careStaff.forEach(other => { if(assignments[getKey(y,m,dd,other.id)] === dayType.id) c++; });
            if(c - 1 < careDayReqLocal) continue; // 外すと必要人数を割る
          }
          if(wouldCreateLongOffRun(mem, dd)) continue; // 交代先で新たに3連休を作らない
          const weekendBonus = isWeekend(y,m,dd) ? 1 : 0; // 土日を優先して休みに回す
          if(weekendBonus > swapScore){ swapScore = weekendBonus; swapDay = dd; }
        }
        if(swapDay === null) break; // 交代相手が見つからない場合はここで諦める(休みの配置は崩さない)

        assignments[getKey(y,m,breakDay,mem.id)] = dayType.id;
        assignments[getKey(y,m,swapDay,mem.id)] = offType.id;
        // workCount合計は変わらない(出勤1減・出勤1増)ため更新不要
      }
    }
    [
      ...(chief ? [chief] : []),
      ...countableNurses.filter(mem => !mem.nightOnly),
      ...weekdayLimitedMembers,
      ...newbieMembers,
      ...careStaff.filter(mem => !mem.nightOnly),
      ...clerkMembers
    ].forEach(reduceUnwishedLongOffRuns);

    // 補正後もズレが残っている場合(本人の休み希望・NGが多すぎる等で、設定した休日数ちょうどに
    // できなかった場合)、原因が分からず「バグでは」と誤解されないよう、一覧に明示しておく。
    function reportOffTargetMismatch(mem){
      const target = personTarget(mem);
      if(workCount[mem.id] === target) return;
      const actualOff = days - workCount[mem.id] - separateLeaveCount(mem); // 有給・リフレッシュ休暇を除いた通常の休み日数
      const diff = workCount[mem.id] - target;
      const reason = diff > 0 ? '本人の勤務希望等により目標より勤務日数が多く' : '本人の休み希望・NG等により目標より休みが多く';
      lastWarnings.push(`${mem.name}: 今月の休日数が${actualOff}日(設定目標は${monthlyOffTarget}日)。${reason}なっています`);
    }
    [
      ...(chief ? [chief] : []),
      ...countableNurses.filter(mem => !mem.nightOnly),
      ...weekdayLimitedMembers,
      ...newbieMembers,
      ...careStaff.filter(mem => !mem.nightOnly),
      ...clerkMembers
    ].forEach(reportOffTargetMismatch);

    // 夜勤研修中の人が、月の目標回数(nightTrainingTarget)に届かなかった場合は注意書きを出す
    // (上限ではなく目標なので、届かなくても割り振り自体は止めない)。nightCountはパス2終了時点の
    // 値のまま以降のトリム処理で更新されないことがあるため、実際のassignmentsから数え直す。
    countableNurses.filter(mem => mem.nightTraining).forEach(mem => {
      let actualNightCount = 0;
      for(let d = 1; d <= days; d++){
        if(assignments[getKey(y,m,d,mem.id)] === nightType.id) actualNightCount++;
      }
      if(actualNightCount < nightTrainingTarget){
        lastWarnings.push(`${mem.name}: 夜勤研修の実績が${actualNightCount}回(目標${nightTrainingTarget}回)でした`);
      }
    });
  }

  // 通常の自動割り振り: 1回だけ生成してすぐ反映する(希望入力の確定などのたびに呼ばれるため、
  // 素早く反応することを優先する)。
  function autoAssign(){
    runAssignmentAttempt();
    renderResultGrid();
    renderSummary();
    renderWarnings();
    saveToStorage();
  }

  // 「自動割り振り」ボタン専用: 乱数によるブレを踏まえ、複数回生成して「調整が必要な箇所」が
  // いちばん少ない結果を採用する。1回ごとに結果がまちまちになりうる問題(希望が多い月ほど
  // 顕著)に対応するため、ボタンを押すたびに複数パターンを試して一番良いものを選ぶ。
  function autoAssignBest(attempts){
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    let best = null;
    for(let i = 0; i < attempts; i++){
      runAssignmentAttempt();
      const snapAssign = {};
      Object.keys(assignments).forEach(k => { if(isKeyInMonth(k,y,m)) snapAssign[k] = assignments[k]; });
      const snapLocked = {};
      Object.keys(locked).forEach(k => { if(isKeyInMonth(k,y,m)) snapLocked[k] = locked[k]; });
      const snapWarnings = lastWarnings.slice();
      const score = snapWarnings.length;
      if(!best || score < best.score){
        best = { score, snapAssign, snapLocked, snapWarnings };
      }
      if(score === 0) break; // 調整不要な結果が出たら、それ以上試す必要はない
    }
    // 最終的な割り当てに、試した中でいちばん良かった結果を反映する
    // (最後に試した回が最良とは限らないため、一旦当月分をクリアしてから上書きする)。
    clearMonthData(y, m);
    Object.assign(assignments, best.snapAssign);
    Object.assign(locked, best.snapLocked);
    lastWarnings = best.snapWarnings;
    renderResultGrid();
    renderSummary();
    renderWarnings();
    saveToStorage();
  }

  function renderWarnings(){
    warningsEl.innerHTML = '';
    if(lastWarnings.length === 0) return;
    const box = document.createElement('div');
    box.style.cssText = `background:${cv('c-amber',50)}; color:${cv('c-amber',800)}; border-radius:var(--border-radius-md); padding:0.75rem 1rem; font-size:12px;`;
    const title = document.createElement('p');
    title.style.cssText = `font-weight:500; margin:0 0 4px;`;
    title.textContent = '調整が必要な箇所';
    box.appendChild(title);
    const uniq = [...new Set(lastWarnings)];
    uniq.slice(0,12).forEach(w => {
      const p = document.createElement('p');
      p.style.cssText = `margin:2px 0;`;
      p.textContent = w;
      box.appendChild(p);
    });
    if(uniq.length > 12){
      const more = document.createElement('p');
      more.style.cssText = `margin:2px 0;`;
      more.textContent = `他 ${uniq.length-12} 件...`;
      box.appendChild(more);
    }
    warningsEl.appendChild(box);
  }

  function renderResultGrid(){
    resultGrid.innerHTML = '';
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const days = daysInMonth(y,m);
    const mems = visibleMembers();
    const weekdayNames = ['日','月','火','水','木','金','土'];

    const table = document.createElement('table');
    table.style.cssText = `border-collapse:collapse; font-size:12px;`;

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px; background:var(--color-background-secondary); position:sticky; left:0; min-width:90px; width:90px; z-index:2;`;
    corner.textContent = '職員 \\ 日付';
    headRow.appendChild(corner);
    buildPrevRefHeaderCells(y,m).forEach(th => headRow.appendChild(th));
    for(let d=1; d<=days; d++){
      const wd = new Date(y,m,d).getDay();
      const th = document.createElement('th');
      th.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; background:var(--color-background-secondary); min-width:30px; width:30px; font-weight:500; font-size:11px; color:${wd===0?cv('c-red',600):(wd===6?cv('c-blue',600):'var(--color-text-primary)')};`;
      th.innerHTML = `${d}<br>${weekdayNames[wd]}`;
      headRow.appendChild(th);
    }
    // 右側に集計列(勤務日数・シフト種別ごとの回数)を追加。日々のマスと並べて、その場で各自の内訳が見えるようにする。
    const summaryCols = [{ id: '__work', label: '勤務' }, ...shiftTypes.map(st => ({ id: st.id, label: st.short }))];
    summaryCols.forEach(col => {
      const sth = document.createElement('th');
      sth.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; background:var(--color-background-secondary); min-width:30px; width:30px; font-weight:500; font-size:11px;`;
      sth.textContent = col.label;
      headRow.appendChild(sth);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // 各日の「日勤リーダー」を1名だけ決める(表示専用・状態は持たず毎回この場で算出)。
    // 「日勤L」対象者のうち、その日実際に日勤に入っている人をメンバー登録順で先頭から1名選ぶ。
    // ただし、(1)前日が休み(休み・有給等のisOffシフト)だった人、(2)前日も日勤リーダーだった人、
    // はなるべく避ける(休み明けにいきなりリーダーを任せたくない・リーダーが連続にならないようにしたい
    // という理由から)。他に選べる人がいない場合はそのまま選ぶ。月をまたぐ場合も前月末日を参照して判定する。
    function wasOffPrevDay(mem, y2, m2, d2){
      let py, pm, pd;
      if(d2 > 1){ py = y2; pm = m2; pd = d2 - 1; }
      else { const info = prevMonthInfo(y2,m2); py = info.prevY; pm = info.prevM; pd = info.prevDays; }
      const key = getKey(py,pm,pd,mem.id);
      const st = shiftTypes.find(s => s.id === assignments[key]);
      return !!(st && st.isOff);
    }
    function leaderCandidatesFor(y2,m2,d2){
      const cands = members.filter(mem => mem.leader && assignments[getKey(y2,m2,d2,mem.id)] === 'day');
      const notJustOff = cands.filter(mem => !wasOffPrevDay(mem,y2,m2,d2));
      return notJustOff.length > 0 ? notJustOff : cands;
    }
    // 前月最終日のリーダーを概算し、月をまたいでもリーダー連続回避が効くようにする
    const { prevY: leaderPrevY, prevM: leaderPrevM, prevDays: leaderPrevDays } = prevMonthInfo(y,m);
    const prevMonthLastLeaderId = (() => {
      const cands = leaderCandidatesFor(leaderPrevY, leaderPrevM, leaderPrevDays);
      return cands.length > 0 ? cands[0].id : null;
    })();

    const dayLeaderIdByDay = {};
    let lastLeaderId = prevMonthLastLeaderId;
    for(let d=1; d<=days; d++){
      let pool = leaderCandidatesFor(y,m,d);
      if(lastLeaderId != null){
        const notSameAsLast = pool.filter(mem => mem.id !== lastLeaderId);
        if(notSameAsLast.length > 0) pool = notSameAsLast; // 他に選べる人がいれば前日と同じ人は避ける
      }
      const chosen = pool.length > 0 ? pool[0].id : null;
      dayLeaderIdByDay[d] = chosen;
      lastLeaderId = chosen;
    }

    const tbody = document.createElement('tbody');
    mems.forEach((mem, memIdx) => {
      const row = document.createElement('tr');
      const nameCell = document.createElement('td');
      nameCell.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px; font-weight:500; font-size:11px; position:sticky; left:0; background:var(--color-background-primary); z-index:1; white-space:nowrap;`;
      // 希望入力画面と同様、名前の前に表内の通し番号を振り、人数が一目で分かるようにする。
      nameCell.textContent = `${memIdx+1}. ${mem.name}${memberTag(mem)}`;
      row.appendChild(nameCell);
      buildPrevRefBodyCells(y,m,mem).forEach(td => row.appendChild(td));

      for(let d=1; d<=days; d++){
        const cell = document.createElement('td');
        cell.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; text-align:center; cursor:pointer;`;
        const key = getKey(y,m,d,mem.id);
        const stId = assignments[key];
        const st = shiftTypes.find(s => s.id === stId);
        const pref = preferences[key];
        const isWished = pref && pref.wish && pref.wish === stId;
        const isTodayLeader = stId === 'day' && dayLeaderIdByDay[d] === mem.id;
        if(st){
          const cd = chiefShift(mem, stId);
          const dc = cd ? cd.color : st.color;
          const ds = cd ? cd.short : st.short;
          cell.style.background = cv(dc,50);
          cell.style.color = cv(dc,800);
          if(isWished){
            const span = document.createElement('span');
            span.textContent = ds;
            span.style.cssText = `text-decoration: underline double; text-decoration-color: ${cv(dc,600)}; text-underline-offset: 2px;`;
            cell.appendChild(span);
          } else {
            cell.textContent = ds;
          }
          // 日勤リーダーの日は、文字の上に小さな点を重ねる方式だと分かりづらいため、
          // セルの背景色はそのままに(新しい色を持ち込まず)、隅に小さく「L」を添えて示す。
          if(isTodayLeader){
            cell.style.position = 'relative';
            const badge = document.createElement('span');
            badge.textContent = 'L';
            badge.style.cssText = `position:absolute; top:0px; right:2px; font-size:9px; font-weight:700; line-height:1; color:${cv(dc,600)};`;
            cell.appendChild(badge);
          }
        } else {
          cell.textContent = '-';
        }
        if(locked[key]){
          cell.style.fontWeight = '500';
          cell.title = '夜勤の連動で自動設定 (クリックで変更可)';
        } else {
          cell.title = isWished ? '希望どおり (クリックで変更)' : 'クリックで変更';
        }
        // 本人の希望(休み等の希望休だけでなく、日勤・夜勤等の希望の勤務も含む)は、
        // 枠線で囲んで一目で分かるようにする。
        if(!manualEdit[key] && pref && pref.wish){
          cell.style.border = `1.5px solid ${cv('c-gray',600)}`;
        }
        if(isTodayLeader){
          cell.title += ' ／ 本日の日勤リーダー';
        }
        // 師長が勤務調整のため手動で変更したセルは、セル上部の「・」で他と区別する
        // (本人の希望どおりかどうかを示す二重下線とも、希望休の枠線とも独立した表示)。
        if(manualEdit[key]){
          cell.style.position = 'relative';
          const dot = document.createElement('span');
          dot.textContent = '・';
          dot.style.cssText = `position:absolute; top:0px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:900; line-height:1; color:${cv('c-purple',600)};`;
          cell.appendChild(dot);
          cell.title = '勤務調整のため手動で変更されています (自動割り振りでも保護されます)';
          if(isTodayLeader) cell.title += ' ／ 本日の日勤リーダー';
        }
        cell.addEventListener('click', () => openResultEditModal(y,m,d,mem));
        row.appendChild(cell);
      }

      // 右側の集計セル: このメンバーの月間の勤務日数・シフト種別ごとの回数
      const counts = {};
      shiftTypes.forEach(st => counts[st.id] = 0);
      let workDays = 0;
      for(let d=1; d<=days; d++){
        const stId = assignments[getKey(y,m,d,mem.id)];
        if(!stId) continue;
        counts[stId] = (counts[stId]||0) + 1;
        const st = shiftTypes.find(s => s.id === stId);
        if(st && !st.isOff) workDays++;
      }
      summaryCols.forEach(col => {
        const scell = document.createElement('td');
        scell.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; text-align:center; font-size:11px; background:var(--color-background-secondary);`;
        scell.textContent = col.id === '__work' ? workDays : (counts[col.id] || 0);
        row.appendChild(scell);
      });
      tbody.appendChild(row);
    });

    // 各日の人数集計行(看護師数は副主任込み・師長は除外。必要人数を下回る日は赤字)
    const dayReq = (shiftTypes.find(s=>s.id==='day')||{}).required || 0;
    const nightReq = (shiftTypes.find(s=>s.id==='night')||{}).required || 0;
    const careDayReq = careRequired.day || 0;
    const inPool = mem => mem.role==='nurse' || mem.role==='subchief';
    // 最低人数は常勤(新人・短時間・夜勤専従を除く)基準。日勤の集計・赤字判定もこれに揃える
    const countablePool = mem => inPool(mem) && !mem.newbie && !mem.parttime && !mem.ikuji && !mem.nightOnly;
    function addCountRow(label, fn, reqCheck){
      const crow = document.createElement('tr');
      const lc = document.createElement('td');
      lc.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px; font-weight:500; font-size:11px; position:sticky; left:0; background:var(--color-background-secondary); z-index:1; white-space:nowrap;`;
      lc.textContent = label;
      crow.appendChild(lc);
      for(let i=0; i<2; i++){
        const spacer = document.createElement('td');
        spacer.style.cssText = `border:0.5px solid var(--color-border-tertiary); background:var(--color-background-secondary);`;
        crow.appendChild(spacer);
      }
      for(let d=1; d<=days; d++){
        const c = document.createElement('td');
        const n = fn(d);
        const short = reqCheck ? reqCheck(n,d) : false;
        c.style.cssText = `border:0.5px solid var(--color-border-tertiary); padding:4px 2px; text-align:center; font-size:11px; font-weight:500; background:var(--color-background-secondary); color:${short?cv('c-red',600):'var(--color-text-primary)'};`;
        c.textContent = n;
        crow.appendChild(c);
      }
      // 右側の集計列の分だけ空セルを埋めて列数を揃える
      summaryCols.forEach(() => {
        const spacer = document.createElement('td');
        spacer.style.cssText = `border:0.5px solid var(--color-border-tertiary); background:var(--color-background-secondary);`;
        crow.appendChild(spacer);
      });
      tbody.appendChild(crow);
    }
    addCountRow('日勤 看護師(常勤)', d => members.filter(mem => countablePool(mem) && assignments[getKey(y,m,d,mem.id)]==='day').length, (n,d) => n < (isWeekend(y,m,d) ? weekendDayReq : dayReq));
    addCountRow('日勤 介護士', d => members.filter(mem => mem.role==='care' && assignments[getKey(y,m,d,mem.id)]==='day').length, n => n < careDayReq);
    addCountRow('夜勤 看護師', d => members.filter(mem => inPool(mem) && assignments[getKey(y,m,d,mem.id)]==='night').length, n => n < nightReq);

    table.appendChild(tbody);
    resultGrid.appendChild(table);
  }

  function openResultEditModal(y,m,d,member){
    overlay.style.display = 'flex';
    modalContent.innerHTML = '';

    const title = document.createElement('p');
    title.style.cssText = `font-weight:500; font-size:15px; margin:0 0 4px;`;
    title.textContent = `${m+1}月${d}日 - ${member.name}`;
    modalContent.appendChild(title);

    const key = getKey(y,m,d,member.id);
    const sub = document.createElement('p');
    sub.style.cssText = `font-size:13px; color:var(--color-text-secondary); margin:0 0 12px;`;
    sub.textContent = manualEdit[key]
      ? '勤務調整のため手動で設定されています。自動割り振りをやり直しても上書きされません。'
      : (locked[key] ? '夜勤の連動ルールで自動設定された割り振りです。変更すると連動は解除されます。' : '割り振りを手動で変更できます');
    modalContent.appendChild(sub);

    const optionsWrap = document.createElement('div');
    optionsWrap.style.cssText = `display:flex; flex-direction:column; gap:6px; margin-bottom:12px;`;

    const days = daysInMonth(y,m);
    availableShiftOptionsFor(member).forEach(st => {
      const btn = document.createElement('button');
      btn.style.cssText = `display:flex; align-items:center; justify-content:space-between; padding:8px 12px; width:100%;`;
      btn.innerHTML = `<span>${st.name}</span>`;
      const dot = document.createElement('span');
      dot.style.cssText = `width:14px; height:14px; border-radius:4px; background:${cv(st.color,50)}; border:1px solid ${cv(st.color,600)};`;
      btn.appendChild(dot);
      btn.addEventListener('click', () => {
        assignments[key] = st.id;
        delete locked[key];
        // このセルを勤務表画面から直接変更した = 業務調整のための手動入力とみなし、
        // 本人の希望とは別に「手動調整済み」の目印を付ける(自動割り振りのやり直しでも保護される)。
        manualEdit[key] = true;

        const akeType = shiftTypes.find(s => s.id === 'ake');
        const offType = shiftTypes.find(s => s.isOff);
        if(st.id === 'night'){
          if(d+1 <= days && akeType){
            locked[getKey(y,m,d+1,member.id)] = akeType.id;
            assignments[getKey(y,m,d+1,member.id)] = akeType.id;
          }
          if(d+2 <= days && offType){
            locked[getKey(y,m,d+2,member.id)] = offType.id;
            assignments[getKey(y,m,d+2,member.id)] = offType.id;
          }
        }
        closeModal();
        renderResultGrid();
        renderSummary();
        saveToStorage();
      });
      optionsWrap.appendChild(btn);
    });

    modalContent.appendChild(optionsWrap);

    const closeBtn = document.createElement('button');
    closeBtn.style.cssText = `width:100%;`;
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', closeModal);
    modalContent.appendChild(closeBtn);
  }

  function renderSummary(){
    summaryGrid.innerHTML = '';
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const days = daysInMonth(y,m);
    const mems = visibleMembers();

    mems.forEach(mem => {
      let workDays = 0;
      const counts = {};
      shiftTypes.forEach(st => counts[st.id] = 0);
      for(let d=1; d<=days; d++){
        const stId = assignments[getKey(y,m,d,mem.id)];
        if(stId){
          counts[stId] = (counts[stId]||0) + 1;
          const st = shiftTypes.find(s => s.id === stId);
          if(st && !st.isOff) workDays++;
        }
      }
      const card = document.createElement('div');
      card.style.cssText = `background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:1rem;`;
      let html = `<p style="font-size:13px; color:var(--color-text-secondary); margin:0 0 4px;">${mem.name}${memberTag(mem)}</p>`;
      html += `<p style="font-size:24px; font-weight:500; margin:0 0 8px;">${workDays}<span style="font-size:13px; color:var(--color-text-secondary); font-weight:400;"> 勤務日</span></p>`;
      shiftTypes.forEach(st => {
        html += `<p style="font-size:12px; color:var(--color-text-secondary); margin:2px 0;">${st.name}: ${counts[st.id]||0}</p>`;
      });
      card.innerHTML = html;
      summaryGrid.appendChild(card);
    });
  }

  function openMembersModal(focusMemberId){
    overlay.style.display = 'flex';
    modalContent.innerHTML = '';

    const title = document.createElement('p');
    title.style.cssText = `font-weight:500; font-size:15px; margin:0 0 8px;`;
    title.textContent = 'メンバー管理';
    modalContent.appendChild(title);

    const filterRow = document.createElement('div');
    filterRow.style.cssText = `display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;`;
    let modalRoleFilter = 'all';
    const roles = [['all','全員'],['chief','師長'],['subchief','副主任'],['nurse','看護師'],['care','介護福祉士'],['clerk','病棟クラーク']];

    const list = document.createElement('div');
    list.style.cssText = `display:flex; flex-direction:column; gap:6px; margin-bottom:12px; max-height:280px; overflow-y:auto;`;

    function renderList(){
      list.innerHTML = '';
      const filtered = modalRoleFilter === 'all' ? members : members.filter(mem => mem.role === modalRoleFilter);
      let dragSrcId = null;
      filtered.forEach(mem => {
        const row = document.createElement('div');
        row.style.cssText = `display:flex; flex-direction:column; gap:4px; padding:6px 8px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md);`;
        row.draggable = true;
        row.addEventListener('dragstart', (e) => {
          dragSrcId = mem.id;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => { row.style.opacity = '0.4'; }, 0);
        });
        row.addEventListener('dragend', () => { row.style.opacity = ''; row.style.background = ''; });
        row.addEventListener('dragover', (e) => { e.preventDefault(); row.style.background = 'var(--color-background-secondary)'; });
        row.addEventListener('dragleave', () => { row.style.background = ''; });
        row.addEventListener('drop', (e) => {
          e.preventDefault();
          row.style.background = '';
          if(!dragSrcId || dragSrcId === mem.id) return;
          const srcIdx = members.findIndex(x => x.id === dragSrcId);
          const dstIdx = members.findIndex(x => x.id === mem.id);
          if(srcIdx === -1 || dstIdx === -1) return;
          const [moved] = members.splice(srcIdx, 1);
          members.splice(dstIdx, 0, moved);
          dragSrcId = null;
          renderList();
          renderInputGrid();
          if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){ renderResultGrid(); renderSummary(); }
          saveToStorage();
        });

        const topRow = document.createElement('div');
        topRow.style.cssText = `display:flex; align-items:center; justify-content:space-between; gap:8px;`;

        const handle = document.createElement('span');
        handle.textContent = '⠿';
        handle.style.cssText = `color:var(--color-text-tertiary); cursor:grab; font-size:14px; flex-shrink:0; user-select:none;`;

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = mem.name;
        nameInput.dataset.memberId = mem.id;
        nameInput.style.cssText = `font-size:13px; flex:1; border:0.5px solid transparent; background:transparent; padding:2px 0; color:var(--color-text-primary); min-width:0;`;
        nameInput.addEventListener('focus', () => {
          nameInput.style.cssText += `border-color:var(--color-border-tertiary); background:var(--color-background-primary); padding:2px 6px; border-radius:var(--border-radius-md);`;
        });
        nameInput.addEventListener('blur', () => {
          const val = nameInput.value.trim();
          if(val){ mem.name = val; renderInputGrid(); renderPairList(); renderPairSelects(); if(hasDataForMonth(currentDate.getFullYear(), currentDate.getMonth())){ renderResultGrid(); renderSummary(); } saveToStorage(); }
          else nameInput.value = mem.name;
          nameInput.style.cssText = `font-size:13px; flex:1; border:0.5px solid transparent; background:transparent; padding:2px 0; color:var(--color-text-primary); min-width:0;`;
        });
        nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') nameInput.blur(); });

        const roleSpan = document.createElement('span');
        roleSpan.style.cssText = `font-size:13px; color:var(--color-text-secondary); white-space:nowrap; flex-shrink:0;`;
        roleSpan.textContent = `(${ROLE_LABELS[mem.role]})`;

        // 誤クリックで即削除されないよう、1回目のクリックでは「本当に削除?」に切り替えるだけにし、
        // その状態でもう一度クリックしたときだけ実際に削除する(一定時間操作がなければ元に戻す)。
        const delBtn = document.createElement('button');
        delBtn.setAttribute('aria-label', `${mem.name}を削除`);
        delBtn.style.cssText = `padding:2px 6px; flex-shrink:0;`;
        delBtn.textContent = '削除';
        let armed = false;
        let armTimer = null;
        function disarm(){
          armed = false;
          if(armTimer){ clearTimeout(armTimer); armTimer = null; }
          delBtn.textContent = '削除';
          delBtn.style.borderColor = '';
          delBtn.style.color = '';
          delBtn.setAttribute('aria-label', `${mem.name}を削除`);
        }
        delBtn.addEventListener('click', () => {
          if(!armed){
            armed = true;
            delBtn.textContent = '本当に削除?';
            delBtn.style.borderColor = cv('c-red',600);
            delBtn.style.color = cv('c-red',600);
            delBtn.setAttribute('aria-label', `${mem.name}を本当に削除する場合はもう一度クリック`);
            armTimer = setTimeout(disarm, 3000); // 3秒操作がなければ通常の「削除」表示に戻す
            return;
          }
          disarm();
          members = members.filter(x => x.id !== mem.id);
          nightNgPairs = nightNgPairs.filter(p => p[0] !== mem.id && p[1] !== mem.id);
          renderList();
          renderPairList();
          renderPairSelects();
          renderInputGrid();
          saveToStorage();
        });

        topRow.appendChild(handle);
        topRow.appendChild(nameInput);
        topRow.appendChild(roleSpan);
        topRow.appendChild(delBtn);
        row.appendChild(topRow);

        // 病棟クラークは師長と同様、夜勤・リーダー等のフラグが一切関係ないため
        // (常に平日日勤・土日休みの既定パターンで、夜勤には入らない)、設定欄は表示しない。
        if(mem.role !== 'chief' && mem.role !== 'clerk'){
          const flagsRow = document.createElement('div');
          flagsRow.style.cssText = `display:flex; gap:10px; font-size:11px; color:var(--color-text-secondary); flex-wrap:wrap;`;

          const mkCheck = (label, prop) => {
            const lab = document.createElement('label');
            lab.style.cssText = `display:flex; align-items:center; gap:3px;`;
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!mem[prop];
            cb.style.cssText = `width:auto;`;
            cb.addEventListener('change', () => {
              mem[prop] = cb.checked;
              renderInputGrid();
              saveToStorage();
            });
            lab.appendChild(cb);
            lab.appendChild(document.createTextNode(label));
            return lab;
          };
          if(mem.role === 'nurse' || mem.role === 'subchief'){
            flagsRow.appendChild(mkCheck('日勤L','leader'));
            flagsRow.appendChild(mkCheck('夜勤L','nightLeader'));
          }
          flagsRow.appendChild(mkCheck('夜勤','nightOK')); // 看護師・介護福祉士とも夜勤可否を指定
          flagsRow.appendChild(mkCheck('夜専','nightOnly')); // 夜勤専従(夜勤のみ・月上限回数)
          {
            // 夜勤傾向: 自動割り振りで夜勤回数を意図的に多め/少なめに寄せたいスタッフ用。
            // 夜勤専従は月上限回数で別管理のため、ここでの設定は効果がない。
            const tendencyLab = document.createElement('label');
            tendencyLab.style.cssText = `display:flex; align-items:center; gap:3px;`;
            tendencyLab.appendChild(document.createTextNode('夜勤傾向:'));
            const tendencySelect = document.createElement('select');
            tendencySelect.style.cssText = `font-size:11px; padding:1px 2px;`;
            [['normal','普通'],['more','多め'],['less','少なめ']].forEach(([val,label]) => {
              const opt = document.createElement('option');
              opt.value = val; opt.textContent = label;
              if((mem.nightTendency || 'normal') === val) opt.selected = true;
              tendencySelect.appendChild(opt);
            });
            tendencySelect.addEventListener('change', () => {
              mem.nightTendency = tendencySelect.value;
              saveToStorage();
            });
            tendencyLab.appendChild(tendencySelect);
            flagsRow.appendChild(tendencyLab);
          }
          if(mem.role === 'nurse') flagsRow.appendChild(mkCheck('新人','newbie'));
          if(mem.role === 'nurse') flagsRow.appendChild(mkCheck('夜勤研修中','nightTraining')); // 1年目等、夜勤にはまだ+1名(先輩)が必要な人
          if(mem.role === 'nurse' || mem.role === 'subchief') flagsRow.appendChild(mkCheck('パート','parttime'));
          if(mem.role === 'nurse' || mem.role === 'subchief') flagsRow.appendChild(mkCheck('育短','ikuji'));
          if(mem.role === 'nurse' || mem.role === 'subchief') flagsRow.appendChild(mkCheck('日曜固定休み','sundayOff'));
          row.appendChild(flagsRow);
        }

        list.appendChild(row);
      });
    }

    roles.forEach(([key,label]) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = `padding:4px 10px; font-size:12px;`;
      if(modalRoleFilter === key){
        btn.style.borderColor = 'var(--color-border-info)';
        btn.style.color = 'var(--color-text-info)';
      }
      btn.addEventListener('click', () => {
        modalRoleFilter = key;
        filterRow.querySelectorAll('button').forEach(b => { b.style.borderColor=''; b.style.color=''; });
        btn.style.borderColor = 'var(--color-border-info)';
        btn.style.color = 'var(--color-text-info)';
        renderList();
      });
      filterRow.appendChild(btn);
    });

    modalContent.appendChild(filterRow);
    modalContent.appendChild(list);
    renderList();
    if(focusMemberId){
      const target = list.querySelector(`input[data-member-id="${focusMemberId}"]`);
      if(target){ target.scrollIntoView({block:'nearest'}); target.focus(); }
    }

    const addRow = document.createElement('div');
    addRow.style.cssText = `display:flex; gap:8px; margin-bottom:12px;`;
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '名前を入力';
    input.style.cssText = `flex:1;`;
    const roleSelect = document.createElement('select');
    roleSelect.style.cssText = `width:110px;`;
    [['nurse','看護師'],['care','介護福祉士'],['subchief','副主任'],['chief','師長'],['clerk','病棟クラーク']].forEach(([k,l]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = l;
      roleSelect.appendChild(opt);
    });
    const addBtn = document.createElement('button');
    addBtn.textContent = '追加';
    addBtn.addEventListener('click', () => {
      const val = input.value.trim();
      if(val){
        // 病棟クラークは師長と同じく夜勤対象外の扱いなので、他の役職と違いnightOKを既定でfalseにする
        // (希望入力のタイル一覧に「夜勤」を出さないため。availableShiftOptionsFor参照)。
        const defaultNightOK = roleSelect.value !== 'chief' && roleSelect.value !== 'clerk';
        members.push({ id: 'mem'+Date.now(), name: val, role: roleSelect.value, leader:false, nightLeader:false, nightOK: defaultNightOK, newbie:false, parttime:false, ikuji:false, nightOnly:false });
        input.value = '';
        renderList();
        renderPairSelects();
        renderInputGrid();
        saveToStorage();
      }
    });
    addRow.appendChild(input);
    addRow.appendChild(roleSelect);
    addRow.appendChild(addBtn);
    modalContent.appendChild(addRow);

    // 夜勤NGペア: 指定した2人を同じ日の夜勤に同時に割り当てない(相性・スキルバランス等)。
    // 人員不足時は他の希望と同様、最終手段としてやむを得ず一緒になることがある。
    const pairTitle = document.createElement('p');
    pairTitle.style.cssText = `font-weight:500; font-size:13px; margin:4px 0 6px;`;
    pairTitle.textContent = '夜勤NGペア(同じ日の夜勤に組ませない)';
    modalContent.appendChild(pairTitle);

    const pairList = document.createElement('div');
    pairList.style.cssText = `display:flex; flex-direction:column; gap:4px; margin-bottom:8px; max-height:120px; overflow-y:auto;`;
    function memberNameById(id){
      const mem = members.find(x => x.id === id);
      return mem ? mem.name : '(削除済み)';
    }
    function renderPairList(){
      pairList.innerHTML = '';
      if(nightNgPairs.length === 0){
        const p = document.createElement('p');
        p.style.cssText = `font-size:11px; color:var(--color-text-tertiary); margin:0;`;
        p.textContent = '登録されているペアはありません';
        pairList.appendChild(p);
        return;
      }
      nightNgPairs.forEach((pair, idx) => {
        const prow = document.createElement('div');
        prow.style.cssText = `display:flex; align-items:center; justify-content:space-between; font-size:12px; padding:4px 8px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md);`;
        const label = document.createElement('span');
        label.textContent = memberNameById(pair[0]) + ' ⇔ ' + memberNameById(pair[1]);
        const delPairBtn = document.createElement('button');
        delPairBtn.textContent = '削除';
        delPairBtn.style.cssText = `padding:2px 8px; font-size:11px;`;
        delPairBtn.addEventListener('click', () => {
          nightNgPairs.splice(idx, 1);
          renderPairList();
          saveToStorage();
        });
        prow.appendChild(label);
        prow.appendChild(delPairBtn);
        pairList.appendChild(prow);
      });
    }
    renderPairList();
    modalContent.appendChild(pairList);

    const pairAddRow = document.createElement('div');
    pairAddRow.style.cssText = `display:flex; gap:6px; margin-bottom:12px; align-items:center;`;
    const pairSelectA = document.createElement('select');
    const pairSelectB = document.createElement('select');
    function renderPairSelects(){
      [pairSelectA, pairSelectB].forEach(sel => {
        const prevVal = sel.value;
        sel.innerHTML = '';
        sel.style.cssText = `flex:1; font-size:12px;`;
        members.filter(mem => mem.role !== 'chief' && mem.role !== 'clerk').forEach(mem => {
          const opt = document.createElement('option');
          opt.value = mem.id;
          opt.textContent = mem.name;
          sel.appendChild(opt);
        });
        if(members.some(mem => mem.id === prevVal)) sel.value = prevVal;
      });
    }
    renderPairSelects();
    const pairAddBtn = document.createElement('button');
    pairAddBtn.textContent = 'ペア追加';
    pairAddBtn.style.cssText = `font-size:12px; padding:4px 8px; white-space:nowrap;`;
    pairAddBtn.addEventListener('click', () => {
      const a = pairSelectA.value, b = pairSelectB.value;
      if(!a || !b || a === b) return;
      const exists = nightNgPairs.some(p => (p[0]===a && p[1]===b) || (p[0]===b && p[1]===a));
      if(exists) return;
      nightNgPairs.push([a, b]);
      renderPairList();
      saveToStorage();
    });
    pairAddRow.appendChild(pairSelectA);
    pairAddRow.appendChild(document.createTextNode('⇔'));
    pairAddRow.appendChild(pairSelectB);
    pairAddRow.appendChild(pairAddBtn);
    modalContent.appendChild(pairAddRow);

    const closeBtn = document.createElement('button');
    closeBtn.style.cssText = `width:100%;`;
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', closeModal);
    modalContent.appendChild(closeBtn);
  }

  function openShiftsModal(){
    overlay.style.display = 'flex';
